<!doctype html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{url}}">
{{hreflang}}
<link rel="alternate" type="text/markdown" href="https://seedwave.pt/onda/igor/wave.md" title="{{agentFile}}">
<link rel="icon" type="image/svg+xml" href="/hub/icon.svg">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="https://seedwave.pt/onda/igor/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="profile">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/onda/onda.css?v={{v}}">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('onda.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<div class="wrap">
<header class="top">
 <a class="brand" href="https://seedwave.pt/hub/?lang={{lang}}"><img src="/hub/icon.svg" alt="SeedWave" width="36" height="36"><span>SeedWave · {{tag}}</span></a>
 <div class="tools"><button class="rb" id="langBtn" type="button" aria-label="{{langLabel}}">{{LANG}}</button><button class="rb" id="themeBtn" type="button" aria-label="{{themeLabel}}">☾</button><nav class="menu" id="langMenu">{{langMenu}}</nav></div>
</header>
<main>
 <section class="hero"><p class="eyebrow">{{place}}</p><h1>{{name}}</h1><p class="l0">{{l0}}</p>
 <svg class="wave" viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true"><path d="M2 17 Q 52 2 102 17 T 202 17 T 302 17 T 402 17 T 502 17 T 598 17"/></svg></section>
 <div class="btns">{{contacts}}</div><p class="note">{{only}}</p>
 <h2>{{main}}</h2><div class="card">{{kv}}</div>
 <h2>{{more}}</h2>{{sections}}
 <div class="ag"><b>{{agents}}</b><br>{{agentsT}} <a href="/onda/igor/wave.md">wave.md</a></div>
 <div class="btns"><button class="btn" id="shareBtn" type="button" data-copied="{{copied}}">{{share}}</button></div>
</main>
<footer class="sw">© <span id="year">2026</span> <a id="hubLink" href="https://seedwave.pt/hub/?lang={{lang}}">SeedWave</a> · <a data-mad href="https://seedwave.pt/madeira/?lang={{lang}}&amp;utm_source=onda&amp;utm_medium=footer">Madeira</a> · <a href="https://www.linkedin.com/in/igor-kartuzov/" target="_blank" rel="noopener">Igor Kartuzov</a></footer>
</div>
<script defer src="/onda/onda.js?v={{v}}"></script>
<script defer src="https://seedwave.pt/nav/sw.js"></script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8a509477310442638b80e4b22319b89b"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
