<!doctype html>
<html lang="{{lang}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{metaDesc}}">
<link rel="canonical" href="{{url}}">
{{hreflang}}
<link rel="icon" type="image/svg+xml" href="/carro/carro-icon.svg">
<link rel="apple-touch-icon" href="/carro/apple-touch-icon.png">
<meta name="theme-color" content="#06141b">
<meta property="og:title" content="{{h1}}">
<meta property="og:description" content="{{metaDesc}}">
<meta property="og:image" content="https://seedwave.pt/carro/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Spectral:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/carro/engine.css?v={{v}}">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('carro.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="lite">
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{fullUrl}}"><img src="/carro/carro-icon.svg" alt="" width="36" height="36"><span>{{brand}} <small>Lite</small></span></a>
    <div class="tools">
      <button class="rb" id="langBtn" type="button" aria-label="{{langLabel}}">{{LANG}}</button>
      <button class="rb" id="themeBtn" type="button" aria-label="{{themeLabel}}">☀</button>
      <nav class="menu" id="langMenu">{{langMenu}}</nav>
    </div>
  </header>

  <main>
    <section class="pain">
      <p class="kicker">{{kicker}}</p>
      <h1>{{h1}}</h1>
      <p class="sub">{{sub}}</p>
    </section>

    <ol class="steps">
{{steps}}
    </ol>

    <section class="done">
      <h2>{{doneTitle}}</h2>
      <p>{{doneText}}</p>
      <div class="row">
        <a class="btn" href="{{fullUrl}}">📅 {{full}}</a>
        <button class="btn ghost" id="shareBtn" type="button">↗ {{share}}</button>
      </div>
      <p class="honest">{{honest}}</p>
    </section>
  </main>

  <footer class="sw">© <span id="year">2026</span> <a id="hubLink" href="https://seedwave.pt/hub/?lang={{lang}}">SeedWave</a> · <a href="https://www.linkedin.com/in/igor-kartuzov/" target="_blank" rel="noopener">Igor Kartuzov</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var theme=document.documentElement.dataset.theme;
  function applyTheme(){document.documentElement.dataset.theme=theme;try{localStorage.setItem('carro.theme',theme)}catch(e){}
    var m=$('meta[name="theme-color"]');if(m)m.content=theme==='light'?'#eef5f6':'#06141b';
    $('#themeBtn').textContent=theme==='light'?'☾':'☀';}
  applyTheme();
  $('#themeBtn').onclick=function(){theme=theme==='light'?'dark':'light';applyTheme()};
  var lb=$('#langBtn'),menu=$('#langMenu');
  lb.onclick=function(e){e.stopPropagation();menu.classList.toggle('open')};
  document.addEventListener('click',function(){menu.classList.remove('open')});
  $('#year').textContent=new Date().getFullYear();
  var toast=$('#toast'),tt;
  function say(s){toast.textContent=s;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},2200)}
  $('#shareBtn').onclick=function(){
    var url=location.origin+location.pathname, text='{{shareTextJs}}';
    if(navigator.share){navigator.share({title:document.title,text:text,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+url).then(function(){say('{{copiedJs}}')})}
  };
  document.querySelectorAll('.copy').forEach(function(btn){btn.onclick=function(){var txt=document.getElementById(btn.dataset.t).textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){say('{{copiedJs}}')})}}});
  document.querySelectorAll('.steps .ck').forEach(function(c){
    var li=c.closest('li');
    try{if(localStorage.getItem('carro.lite.'+c.dataset.k)==='1'){c.checked=true;li.classList.add('ok')}}catch(e){}
    c.onchange=function(){li.classList.toggle('ok',c.checked);try{localStorage.setItem('carro.lite.'+c.dataset.k,c.checked?'1':'0')}catch(e){}};
  });
})();
</script>
<script defer src="https://seedwave.pt/nav/sw.js"></script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8a509477310442638b80e4b22319b89b"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
