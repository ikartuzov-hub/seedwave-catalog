<!doctype html>
<html lang="{{lang}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{metaDesc}}">
<link rel="canonical" href="{{url}}">
{{hreflang}}
<link rel="icon" type="image/svg+xml" href="/carro/carro-icon.svg">
<link rel="apple-touch-icon" href="/carro/apple-touch-icon.png">
<link rel="manifest" href="/carro/m/carro-{{lang}}.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{brand}}">
<meta name="theme-color" content="#06141b">
<meta property="og:title" content="{{brand}} — {{slogan}}">
<meta property="og:description" content="{{metaDesc}}">
<meta property="og:image" content="https://seedwave.pt/carro/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Spectral:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/carro/engine.css?v={{v}}">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('carro.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{url}}"><img src="/carro/carro-icon.svg" alt="" width="36" height="36"><span>{{brand}}</span></a>
    <div class="tools">
      <button class="rb" id="langBtn" type="button">{{LANG}}</button>
      <button class="rb" id="themeBtn" type="button">☀</button>
      <nav class="menu" id="langMenu">{{langMenu}}</nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>{{heroTitle}}</h1>
      <p>{{heroSub}}</p>
    </section>

    <div id="app"><div class="card"><p class="label">{{plateLabel}}</p><p class="note">🔒 {{plateNote}}</p></div></div>

    <section class="about">
      <h2>{{aboutTitle}}</h2>
      <ul>
        <li>🚗 {{about.ipo}}</li>
        <li>💶 {{about.iuc}}</li>
        <li>🛡️ {{about.ins}}</li>
        <li>🔧 {{about.svc}}</li>
      </ul>
      <p class="honest">{{honest}}</p>
    </section>
  </main>

  <footer class="sw">© <span id="year">2026</span> <a id="hubLink" href="https://seedwave.pt/hub/?lang={{lang}}">SeedWave</a> · <a href="https://www.linkedin.com/in/igor-kartuzov/" target="_blank" rel="noopener">Igor Kartuzov</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script defer src="/carro/engine.js?v={{v}}"></script>
<script defer src="https://seedwave.pt/nav/sw.js"></script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8a509477310442638b80e4b22319b89b"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
