<style>
:root{--bg:#fbf6f0;--surface:#fff;--ink:#2b1a14;--ink-soft:#7a5f54;--line:rgba(158,59,50,.18);--accent:#9e3b32;--accent-ink:#fff;--head:"Lora",Georgia,serif;--body:"Manrope",system-ui,sans-serif;--r:18px}
:root[data-theme=dark]{--bg:#1c1210;--surface:#2a1b17;--ink:#f6ece4;--ink-soft:#c4a99c;--line:rgba(246,236,228,.13);--accent:#e0806f;--accent-ink:#1c1210}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:700 18px/1.2 var(--head)}
.brand img{width:36px;height:36px;border-radius:10px}
.tools{display:flex;gap:8px;position:relative}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:800 13px var(--body);display:grid;place-items:center;cursor:pointer}
.menu{position:absolute;right:48px;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;z-index:20;box-shadow:0 10px 30px rgba(43,26,20,.18)}
.menu.open{display:block}.menu a{display:block;text-decoration:none;padding:8px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink)}.menu a[aria-current]{background:rgba(158,59,50,.12)}
.rec{margin:4px 0 2px;font:800 15px/1.3 var(--body);color:var(--accent)}
.big{display:block;width:100%;text-align:center;font-size:17px;padding:15px 20px}
.invite{margin-top:34px}
h1{font:700 30px/1.15 var(--head);margin:0 0 6px}
.muted{color:var(--ink-soft);margin:0 0 16px}
.flag{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;font:600 14px/1.45 var(--body);margin:0 0 18px}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:13px 20px;font:800 16px/1.2 var(--body);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn[disabled]{opacity:.5}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:18px 0}
.box h3{margin:0 0 10px;font:700 19px/1.25 var(--head)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px/1 var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px}
.note{font-size:14px;color:var(--ink-soft);margin:10px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.link{background:none;border:0;padding:0;color:var(--ink-soft);font:600 14px/1.4 var(--body);text-decoration:underline;cursor:pointer}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-soft);text-align:center}
footer a{color:inherit}
[hidden]{display:none!important}
.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 18px/1.3 var(--head)}
.fold>summary::-webkit-details-marker{display:none}.fold>summary::after{content:"＋";font:800 18px/1 var(--body);color:var(--accent)}.fold[open]>summary::after{content:"－"}
.fold[open]>summary{margin-bottom:10px}
.lib a.lt{color:var(--accent);text-decoration:none}
.gv{display:inline-block;font-size:13px;color:var(--accent);font-weight:700;margin-right:6px}
.lstack .th a{color:var(--accent)}
.mv{display:block;margin:2px 0 10px auto;width:auto;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:600 13px/1.2 var(--body);background:var(--surface);color:var(--ink-soft)}
.lib{list-style:none;margin:0;padding:0}.lib li{border-top:1px solid var(--line);padding:10px 0}.lib li:first-child{border-top:0}
.lib .lt{font-weight:700}.lib .la{font-size:13px;color:var(--ink-soft);margin-left:6px}.lib .lth{font-size:14px;color:var(--ink-soft);margin:2px 0 0}
.lib .mv{margin:6px 0 0}
.libs{margin:8px 0 2px;font:700 14px/1.3 var(--body);color:var(--ink-soft)}
.fr{font-size:13px;color:var(--ink-soft);margin-left:6px}.fr a{color:inherit}
.wact{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}.wact .chip{padding:8px 12px}
.wgv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
select.where{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px}
</style>
