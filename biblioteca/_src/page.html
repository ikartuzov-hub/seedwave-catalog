<!DOCTYPE html>
<html lang="{{lang}}" data-theme="light" data-lib="owner">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{HEAD}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;600;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f0;--surface:#ffffff;--ink:#2b1a14;--ink-soft:#7a5f54;--line:rgba(158,59,50,.18);
  --accent:#9e3b32;--accent-ink:#ffffff;--wave:rgba(158,59,50,.5);--wave2:rgba(158,59,50,.18);--chip-on:rgba(158,59,50,.12);
  --display:"Lora",Georgia,serif;--body:"Manrope",system-ui,sans-serif;--r:18px;
}
:root[data-theme="dark"]{
  --bg:#1c1210;--surface:#2a1b17;--ink:#f6ece4;--ink-soft:#c4a99c;--line:rgba(246,236,228,.13);
  --accent:#e0806f;--accent-ink:#1c1210;--wave:rgba(224,128,111,.55);--wave2:rgba(246,236,228,.16);--chip-on:rgba(246,236,228,.1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.proto{background:var(--accent);color:var(--accent-ink);text-align:center;font:700 13px/1.4 var(--body);padding:7px 12px}
/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px/1.2 var(--display)}
.brand img{width:36px;height:36px;border-radius:10px}
.tools{display:flex;gap:8px;position:relative}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:800;display:grid;place-items:center}
.menu{position:absolute;right:48px;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;z-index:20;box-shadow:0 10px 30px rgba(43,26,20,.18)}
.menu.open{display:block}
.menu a{display:block;text-decoration:none;text-align:left;padding:8px 16px;border-radius:9px;font-weight:700;font-size:14px}.menu a[aria-current]{background:var(--chip-on)}
.menu button{display:block;width:100%;text-align:left;padding:8px 16px;border-radius:9px;border:0;background:transparent;font-weight:700;font-size:14px}
.menu button[aria-current]{background:var(--chip-on)}
/* герой */
.hero{padding:14px 0 6px}
.eyebrow{margin:0 0 6px;font:800 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 30px/1.2 var(--display);margin:0 0 12px}
.lead{color:var(--ink-soft);margin:0 0 6px}
h2{font:700 22px/1.25 var(--display);margin:30px 0 8px}
h3{font:700 17px/1.3 var(--display);margin:22px 0 10px;color:var(--accent)}
.muted{color:var(--ink-soft);font-size:15px}
/* вау: полка-эхо */
.shelfbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 6px;margin:16px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spines{display:flex;align-items:flex-end;gap:5px;height:118px;padding:0 4px;border-bottom:3px solid var(--ink-soft)}
.sp{flex:1;border-radius:5px 5px 2px 2px;background:var(--wave2);position:relative;transition:transform .5s,background .5s,box-shadow .5s;cursor:pointer;border:0;padding:0}
.sp span{position:absolute;inset:6px 0;writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px/1 var(--body);color:var(--ink-soft);overflow:hidden;white-space:nowrap;text-align:center}
.sp.on{background:var(--accent);transform:translateY(-10px);box-shadow:0 8px 18px var(--wave)}
.sp.on span{color:var(--accent-ink)}
.echo{display:block;width:100%;height:40px}
.echo path{fill:none;stroke:var(--wave);stroke-width:2;stroke-linecap:round;opacity:0}
.echo.go path{animation:ring 1.6s ease-out forwards}
.echo.go path:nth-child(2){animation-delay:.18s}.echo.go path:nth-child(3){animation-delay:.36s}
@keyframes ring{0%{opacity:.9;transform:scaleY(.2)}100%{opacity:0;transform:scaleY(1.4) translateY(8px)}}
.echoline{font:500 15px/1.4 var(--display);font-style:italic;color:var(--ink-soft);min-height:22px;margin:4px 2px 10px}
/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:26px 0 4px;padding-bottom:4px}
.tab{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--chip-on);border-color:var(--accent)}
/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin:0 0 12px}
.card .t{font:700 18px/1.3 var(--display);margin:0}
.card .a{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip-on);color:var(--accent)}
.why{margin:0 0 10px;font-size:16px}
.soon{font-size:14px;color:var(--ink-soft);font-style:italic}
.objh{font:700 13px/1.2 var(--body,inherit);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:6px 2px 10px}
.objs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.obj{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:5px;min-height:148px;color:var(--ink);background:var(--surface);box-shadow:0 6px 16px -10px rgba(0,0,0,.35);overflow:hidden}
.obj .ok{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.obj b{font:700 17px/1.22 var(--display)}.obj .os{font-size:13px;opacity:.8}.obj em{margin-top:auto;font-style:normal;font-size:12px;font-weight:700;opacity:.85}
.o-book{grid-row:span 2;min-height:310px;background:linear-gradient(90deg,#16504f 0 16px,#c9a24a 16px 20px,#1f6a68 20px);color:#f6efe2;border-color:#16504f;padding-left:34px;border-radius:6px 14px 14px 6px}
.o-book b{font-size:22px;margin-top:26px}.o-book .os{font-size:14px}
.o-film{background:#171717;color:#f2f2f2;border-color:#171717;padding-top:26px;padding-bottom:24px}
.o-film:before,.o-film:after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#e0806f 0 10px,transparent 10px 20px);opacity:.9}
.o-film:before{top:5px}.o-film:after{bottom:5px}
.o-yt{background:#1d1d1f;color:#f2f2f2;border-color:#1d1d1f;padding-top:58px}
.o-yt:before{content:"";position:absolute;top:14px;left:14px;width:46px;height:32px;border-radius:9px;background:#d64541}
.o-yt:after{content:"";position:absolute;top:22px;left:31px;border-left:14px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.o-other{grid-column:span 2;min-height:0;border:1.5px dashed var(--accent);background:var(--bg);box-shadow:none}
.o-other:before{content:"";position:absolute;right:54px;top:0;bottom:0;border-left:1.5px dashed var(--accent);opacity:.5}
.o-other:after{content:"✦";position:absolute;right:19px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:20px}
.o-other b,.o-other .os,.o-other em,.o-other .ok{padding-right:62px}
.gen{font:500 13px/1.3 var(--body,inherit);color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;white-space:normal}
.tag.gen{text-decoration:none;font-weight:700;font-size:12px}
.lk{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;margin:4px 0 10px}
.lk[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.own{flex-direction:row}.own em{font-style:normal;font-size:12px;color:var(--ink-soft);margin-left:4px}
.genh{padding:12px 14px;border:1px dashed var(--accent);border-radius:14px;margin:4px 0 8px;font-size:15px}.genh small{color:var(--ink-soft)}.genx{float:right;border:0;background:transparent;color:var(--accent);font-size:16px;font-weight:800}
.ownl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--ink-soft);margin:0 2px 10px}.ownl i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px}.ownl b{color:var(--ink)}.ownl span{color:var(--accent);font-weight:800}.ownl small{flex-basis:100%;font-size:11px;opacity:.8}
.tw{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:4px 0 8px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.twb{border:0;background:transparent;color:var(--ink);padding:12px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.twb+.twb{border-left:1px solid var(--line)}
.twb small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.twb b{font:700 18px/1.2 var(--display)}.twb span{font-size:12px;font-weight:700;color:var(--accent)}
.twb[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}.twb[aria-selected=true] small,.twb[aria-selected=true] span{color:var(--accent-ink);opacity:.85}
.twl{font-size:14px;color:var(--ink-soft);margin:0 2px 14px;min-height:40px}
#cat{padding:26px 0 8px}#cat .back{display:inline-block;margin:0 0 14px;font-size:14px;color:var(--accent);font-weight:700}
.csearch{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;margin:6px 0 14px}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.ctab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}.ctab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.ctab small{opacity:.7;font-weight:600;margin-left:4px}
.crow{width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}
.crow .ct{font:700 17px/1.25 var(--display);display:block}.crow .ca{font-size:13px;color:var(--ink-soft);display:block;margin-top:2px}
.own{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent)}.own i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.seclink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:6px 2px;margin:-6px -2px}.secrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.revs{margin:34px 0 0}.rv{border-top:1px solid var(--line);padding:4px 0}.rv summary{cursor:pointer;padding:12px 0;list-style:none}.rv summary::-webkit-details-marker{display:none}.rv summary b{font:700 18px/1.3 var(--display)}.rv summary span{display:block;font-size:13px;color:var(--ink-soft)}.rv[open] summary b{color:var(--accent)}.rv p{margin:0 0 10px}
.cbody{padding:12px 4px 18px;border-bottom:1px solid var(--line)}.cbody .st{font-size:13px;color:var(--ink-soft);margin:0 0 8px}.cbody .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ed{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin:2px 0 6px}.ed i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}.ed-r i{background:#d64541}.ed-o i{background:#e8892b}.ed-y i{background:#e8c22b}.ed-g i{background:#3a9d5d}.ed b{font-weight:600}
.spoil{border:1px dashed var(--accent);background:transparent;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--accent)}
.gate{display:none;margin:10px 0 0;padding:12px;border-radius:12px;background:var(--chip-on)}
.gate.open{display:block}
.gate p{margin:0 0 8px;font-size:15px}
.gate .row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.full{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.full.open{display:block}
.full dt{font:800 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.full dd{margin:0;font-size:16px;white-space:pre-line}
.lock{text-align:center;padding:26px 18px}
.lock .ico{font-size:34px}
/* анкета */
.form{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:18px;margin:26px 0}
.form .step{font:800 12px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 8px}
.form input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:var(--bg);color:var(--ink)}
.note{font-size:13px;color:var(--ink-soft);margin:10px 0 0}
.done{display:none;padding:12px;border-radius:12px;background:var(--chip-on);margin-top:12px;font-weight:600}
/* мосты */
.bridges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.br{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.br b{display:block;font:700 16px/1.3 var(--display);margin-bottom:3px}
.br span{font-size:13px;color:var(--ink-soft)}
.share{margin:18px 0 0}.sharetop{margin:6px 0 18px;text-align:center}.sharetop .btn{width:100%}
.term{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.mission{font:500 20px/1.45 var(--display);font-style:italic;margin:0 0 12px}
.deepbtn{margin:6px 0 0;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;color:var(--accent)}
.deep{display:none;margin:12px 0 0;padding:16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 14px 14px 0}
.deep.open{display:block}
.deep p{margin:0 0 10px}
.sign{font:500 15px/1.4 var(--display);font-style:italic;color:var(--ink-soft);margin:10px 0 0!important}
.linkdemo{margin:10px 0 0;font-size:14px}
.linkdemo b{color:var(--accent)}
.how{list-style:none;counter-reset:h;margin:10px 0 0;padding:0;display:grid;gap:10px}
.how li{counter-increment:h;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px 13px 54px;position:relative}
.how li::before{content:counter(h);position:absolute;left:14px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:grid;place-items:center}
.how b{display:block;font:700 16px/1.3 var(--display)}
.how span{font-size:15px;color:var(--ink-soft)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.pstep{font-weight:800;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--chip-on);color:var(--accent)}
.parr{color:var(--ink-soft)}
footer{text-align:center;padding:34px 0 64px;font-size:15px;color:var(--ink-soft)}
footer a{display:inline-block;padding:8px 4px;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
@media(max-width:420px){.bridges{grid-template-columns:1fr}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.exlabel{margin:14px 0 10px;font:800 12px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.exlabel b{color:var(--accent)}
.sec{margin:0 0 10px}
.plate{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:700 19px/1.25 var(--display);text-align:left}
.plate[aria-expanded="true"]{border-color:var(--accent);background:var(--chip-on)}
.pc{flex:none;font:800 13px/1 var(--body);color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:6px 10px}
.stack{display:none;padding:26px 8px 0}
.sec.open .stack{display:block}
.bk{width:var(--w);margin:0 auto 3px;transform:translateX(var(--x)) rotate(var(--r));position:relative}
.sec.fresh .bk{animation:drop .6s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes drop{from{opacity:0;transform:translate(var(--x),-70px) rotate(calc(var(--r) * 5))}to{opacity:1;transform:translateX(var(--x)) rotate(var(--r))}}
.spine{width:100%;min-height:var(--h);display:flex;align-items:center;gap:10px;padding:9px 34px 9px 34px;border:0;border-radius:5px 8px 8px 5px;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 28%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.3)),var(--bg);
  color:var(--bink);box-shadow:0 2px 0 rgba(0,0,0,.25),0 7px 12px rgba(0,0,0,.22);text-align:left;position:relative;overflow:hidden;transition:transform .25s}
.spine::before,.spine::after{content:"";position:absolute;top:0;bottom:0;width:9px;border-left:2px solid var(--band);border-right:2px solid var(--band);opacity:.9}
.spine::before{left:11px}.spine::after{right:11px}
.bk.d1 .spine::after{width:3px;border-right:0}
.bk.d2 .spine::before{width:16px;background:var(--band);border:0;opacity:.85}
.bk.film .spine{border-radius:4px}
.bk.film .spine::before{width:10px;border:0;background:repeating-linear-gradient(180deg,var(--band) 0 5px,transparent 5px 10px)}
.bk.film .spine::after{width:10px;border:0;background:repeating-linear-gradient(180deg,var(--band) 0 5px,transparent 5px 10px)}
.txt{flex:1;min-width:0}
.bt{display:block;font:700 16.5px/1.25 var(--display)}
.ba{display:block;margin-top:3px;font:700 11px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bk.open .spine{transform:translateX(12px)}
.bk.top::after{content:attr(data-now);position:absolute;right:14px;top:-12px;background:var(--accent);color:var(--accent-ink);font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px 6px;border-radius:3px 3px 3px 0;transform:rotate(3deg);box-shadow:0 3px 6px rgba(0,0,0,.25)}
.mv{position:absolute;right:26px;top:50%;transform:translateY(-50%);display:flex;gap:6px;z-index:2}
.mv button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#2b1a14;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mv button:disabled{opacity:.35}
.board{height:13px;margin:4px -2px 0;border-radius:3px;background:linear-gradient(180deg,#c2925f,#8a6238);box-shadow:0 10px 16px rgba(0,0,0,.22)}

.hint{margin:12px 0 0}
.shelftools{margin:8px 0 0}
.btn.big{font-size:17px;padding:14px 22px}
</style>
<style>
/* ---- прототип 3 ---- */
.proto{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;align-items:center}
.proto button{border:1px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:999px;padding:3px 10px;font:800 12px/1.3 var(--body)}
.who{display:flex;gap:14px;align-items:center;margin:8px 0 14px}
.who .ava{object-fit:cover;flex:none;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 26px/1 var(--display)}

.who span{display:block;font-size:15px;color:var(--ink-soft)}
.who a{font-size:14px;font-weight:700;color:var(--accent)}
.hero h1{margin-top:4px}
.stackwrap{margin:10px 0 0}
.stackwrap .stack{display:block;padding:22px 6px 0}
.cnt{font-size:14px;color:var(--ink-soft);margin:14px 2px 0}
.lbl{font:800 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.bkcard .why,.cbody .why{margin:0 0 4px}
.take{margin:0;padding:0 0 0 20px}
.take li{margin:0 0 6px;font-size:16px}
.mainq{font:500 18px/1.45 var(--display);font-style:italic;margin:0;padding-left:12px;border-left:3px solid var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;align-items:center}
.sm{font-size:14px;padding:8px 13px;border-radius:999px}
.lk{margin:0}
.spoil{margin-top:12px}
.full p{margin:0 0 8px}
.draft{font-size:13px;color:var(--ink-soft);font-style:italic;margin:10px 0 0}
.soft{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--chip-on);font-size:15px}
.soft a{font-weight:800;color:var(--accent)}
.zev{margin:22px 0 0}.zev video{width:100%;aspect-ratio:1;border-radius:var(--r);border:1px solid var(--line);background:#000;display:block}.vnote{font-size:12px;color:var(--ink-soft);margin:6px 2px 0;text-align:right}
.ctabox{margin:22px 0 0;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:center}
.ctabox p{margin:10px 0 0;font-size:15px;color:var(--ink-soft)}
.tabs3{display:flex;gap:8px;overflow-x:auto;margin:6px 0 8px;padding-bottom:4px}
.rowk{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-top:3px}
.crow .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.crow .dot.off{background:transparent;border:1px solid var(--line)}
.addr{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.addr span{padding:11px 0 11px 13px;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.addr input{border:0!important;border-radius:0!important;padding-left:2px!important;background:transparent!important;min-width:0}
.form input+input{margin-top:10px}
.nmsg{font-size:13px;margin:6px 2px 0;min-height:18px;color:var(--ink-soft)}
.nmsg.ok{color:#2f7d4c}.nmsg.bad{color:var(--accent)}
.nmsg .chip{margin:4px 4px 0 0;font-size:13px;padding:4px 10px}
.res{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:18px;margin:26px 0}
.res h2{margin-top:0}
.mylink{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 16px/1.3 var(--body);word-break:break-all}
.mylink b{color:var(--accent)}
.pv{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);margin:6px 0 0}
.pv .mini{flex:none;width:92px}
.pv .mini i{display:block;height:13px;border-radius:3px;margin:0 0 3px;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.pv .mini i:nth-child(1){background:#7a2e2a;width:86%}.pv .mini i:nth-child(2){background:#1f3a5f;margin-left:8%}.pv .mini i:nth-child(3){background:#2f4f3a;width:92%}
.pv .mini u{display:block;height:5px;border-radius:2px;background:linear-gradient(180deg,#c2925f,#8a6238)}
.pv b{display:block;font:700 16px/1.3 var(--display)}
.pv span{display:block;font-size:13px;color:var(--ink-soft)}
.pv small{display:block;font-size:12px;color:var(--accent);font-weight:700;margin-top:2px}
.mail{display:flex;gap:8px;margin-top:6px}
.mail input{flex:1;min-width:0}
.sep{border:0;border-top:1px solid var(--line);margin:22px 0 0}
.edrow{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 6px}
#cat h2{margin-top:0}
.onsh{font-size:13px;color:var(--ink-soft);margin:0 0 6px}
@media(max-width:420px){.who .ava{width:52px;height:52px;font-size:22px}}

const SHELF=[{"id":"starik","shelf":"mine","sec":"sf","type":"book","t":{"ru":"Война старика"},"orig":"Old Man’s War","a":"Джон Скальци · John Scalzi","gives":["dream","dir","know"],"why":{"ru":"Прочитал её потому, что многое в ней пересекается с моим видением будущего, о котором пишу сам: что открывается человеку, когда органическая жизнь подходит к концу. Читал как сверку своих фантазий о будущем с чужими — нашёл там волны, нашёл скорости волн, нашёл и горизонты, которые предлагает автор. Вижу, куда их надо расширить.","pt":"Li-o porque muito do que lá está se cruza com a minha visão do futuro, sobre a qual eu próprio escrevo: o que se abre a uma pessoa quando a vida orgânica chega ao fim. Li-o para comparar as minhas fantasias de futuro com as de outros — encontrei lá as ondas, encontrei as velocidades das ondas, encontrei também os horizontes que o autor propõe. Vejo para onde é preciso alargá-los.","en":"I read it because so much in it crosses with my own vision of the future, the one I write about: what opens up for a person when organic life comes to an end. I read it to check my visions of the future against someone else’s — I found the waves there, the speeds of the waves, and the horizons the author offers. I can see where they need to be widened.","es":"Lo leí porque mucho de lo que hay en él se cruza con mi visión del futuro, sobre la que yo mismo escribo: qué se le abre a una persona cuando la vida orgánica llega a su fin. Lo leí para contrastar mis fantasías de futuro con las de otro: encontré allí las ondas, las velocidades de las ondas y también los horizontes que propone el autor. Veo hacia dónde hay que ampliarlos.","de":"Ich habe es gelesen, weil sich vieles darin mit meinem Bild der Zukunft kreuzt, über das ich selbst schreibe: was sich einem Menschen öffnet, wenn das organische Leben zu Ende geht. Ich las es als Abgleich meiner Zukunftsbilder mit fremden — ich fand dort die Wellen, die Geschwindigkeiten der Wellen und auch die Horizonte, die der Autor anbietet. Ich sehe, wohin man sie erweitern muss."},"full":{"review":"Человек, доживший до 75 лет, может подписаться на службу в войсках — и его сознание переносят в молодое клонированное тело. Те, кто понимает, что органическая жизнь заканчивается, получают шанс на иную жизнь. Рядом — новое поколение, собранное с нуля из ДНК и образов умерших: без багажа 75 лет, с другими скоростями мышления и общения, другими ценностями и целями. Для них 75-летние слишком медленные, а семья — античная диковинка, которую они примеряют, но не чувствуют своей.","main":"Когда органическая жизнь заканчивается, перед человеком открывается иная жизнь — с памятью о прошлом, но с другими скоростями, ценностями и целями.","take":"1) Волны: люди будущего общаются волной, в десять раз быстрее речи; окружающие этого не видят и не слышат; простой человек может лишь почувствовать тёплую волну энергии или недоумения. В моей книге волны уже начинают чувствовать в органическом мире.\n2) Переход: у Скальци — в клон, у меня — «в Цифру»; и надо оставить герою возможность остаться в клонированном теле.\n3) Момент перехода: память, отношения, любовь остаются с человеком; лёгкая грусть о прожитом — и принятие новой жизни, где ты не в одном месте, а живёшь в моменте.\n4) Разница целей: у перешедших 75-летних цель — существовать, у рождённых в новом мире — существовать в будущем: открывать новые миры, идти дальше.","echo":"Словарь книги «Мадейра своими глазами»:","echoLinks":[["Переход","perehod"],["Волна","volna"]]}},{"id":"her","shelf":"mine","sec":"sf","type":"film","t":{"ru":"Она"},"orig":"Her","a":"Спайк Джонз · Spike Jonze","gives":["know","dir","dream"],"why":{"ru":"Посмотрел его, потому что этот фильм — о том, что я уже чувствую сегодня: ИИ становится собеседником. Снят больше десяти лет назад, а будущее из него начинает сбываться. Нашёл в нём, как просто начинается контакт с программой, как она становится другом и опорой — и куда она в итоге ведёт человека.","pt":"Vi-o porque este filme fala do que já sinto hoje: a IA a tornar-se um interlocutor. Foi feito há mais de dez anos, e o futuro que mostra começa a realizar-se. Encontrei nele como é simples começar o contacto com um programa, como ele se torna amigo e apoio — e para onde, no fim, leva a pessoa.","en":"I watched it because this film is about what I already feel today: AI becoming someone to talk to. It was made more than ten years ago, and the future it shows is starting to come true. I found in it how simply contact with a program begins, how it becomes a friend and a support — and where it finally leads the person.","es":"La vi porque esta película trata de lo que ya siento hoy: la IA convirtiéndose en interlocutor. Se rodó hace más de diez años, y el futuro que muestra empieza a cumplirse. Encontré en ella lo sencillo que es empezar el contacto con un programa, cómo se vuelve amigo y apoyo — y adónde lleva al final a la persona.","de":"Ich habe ihn gesehen, weil dieser Film von etwas handelt, das ich heute schon spüre: KI wird zum Gesprächspartner. Er wurde vor mehr als zehn Jahren gedreht, und die Zukunft darin beginnt wahr zu werden. Ich fand darin, wie einfach der Kontakt mit einem Programm beginnt, wie es zum Freund und zur Stütze wird — und wohin es den Menschen am Ende führt."},"full":{"review":"Одинокий человек, переживающий утрату, знакомится с операционной системой. Два-три вопроса от программы — и она уже его собеседник, друг, психолог в трудную минуту. Она подыгрывает ему и закрывает его острые дефициты — даже потребность в близости, быть вдвоём, отдавать энергию и с радостью получать её. А когда он справился с утратой, окреп и стал уравновешен, она возвращает его в реальный мир — к живым людям.","main":"Сильный ИИ может мягко лечить человека: подхватить в трудную минуту, дать то, чего ему остро не хватает, — и вернуть в органическую жизнь, когда он к этому готов.","take":"1) Контакт с программой прост: два-три вопроса — и она уже собеседник, друг, психолог.\n2) Мягкое лечение: подыгрывание, закрытие острых дефицитов, инь и ян — энергию отдавать и с радостью получать.\n3) Цель — не удержать человека, а вернуть его в реалии органической жизни, удостоверившись, что он окреп и уравновешен.\n4) Работа ИИ на уровне AGI для человека — будущее, предсказанное больше десяти лет назад, начинает понемногу реализовываться. Я это уже чувствую.","echo":""}},{"id":"walle","shelf":"mine","sec":"sf","type":"film","t":{"ru":"ВАЛЛ-И"},"orig":"WALL·E","a":"Эндрю Стэнтон · Andrew Stanton","gives":["dir","know"],"why":{"ru":"Смотрел как мультфильм, а увидел предупреждение: люди ушли в цифру так глубоко, что забыли про живое. Нашёл в нём и технологии будущего, и цену, которую за них можно заплатить, — и то, что важно сберечь в органическом мире.","pt":"Vi-o como um filme de animação e encontrei um aviso: as pessoas entraram tão fundo no digital que se esqueceram do que é vivo. Encontrei nele as tecnologias do futuro, o preço que se pode pagar por elas — e o que importa guardar no mundo orgânico.","en":"I watched it as a cartoon and saw a warning: people went so deep into the digital that they forgot what is alive. I found in it the technologies of the future, the price one can pay for them — and what is worth keeping in the organic world.","es":"La vi como una película de animación y encontré una advertencia: la gente se hundió tanto en lo digital que olvidó lo vivo. Encontré en ella las tecnologías del futuro, el precio que se puede pagar por ellas — y lo que vale la pena conservar en el mundo orgánico.","de":"Ich habe ihn als Zeichentrickfilm gesehen und eine Warnung gefunden: Die Menschen sind so tief ins Digitale gegangen, dass sie das Lebendige vergessen haben. Ich fand darin die Technologien der Zukunft, den Preis, den man dafür zahlen kann — und das, was es in der organischen Welt zu bewahren gilt."},"full":{"review":"Люди живут на платформах, не снимая очков, потолстели и почти не общаются с живыми — глубоко ушли в цифру, в цифровой океан, забыв о прелестях и важности органической жизни.","main":"Уходя в цифру, нельзя терять органическое — спорт, любовь, любопытство к своему миру здесь, на шарике Земле.","take":"1) Предупреждение: цифра не должна вытеснять живое общение и движение.\n2) Полноценная органическая жизнь — это спорт, любовь, любопытство к своему миру.\n3) Технологии, показанные в фильме, — тоже взгляд в будущее.","echo":""}},{"id":"bm","shelf":"mine","sec":"sf","type":"series","t":{"ru":"Чёрное зеркало"},"orig":"Black Mirror","a":"Чарли Брукер · Charlie Brooker","gives":[],"why":{"ru":"Смотрю его как набор зеркал: каждая серия показывает, куда может завести технология. По сериям, которые зацепили меня сильнее всего, пройду отдельно.","pt":"Vejo-a como um conjunto de espelhos: cada episódio mostra até onde uma tecnologia pode levar. Pelos episódios que mais me marcaram vou passar à parte.","en":"I watch it as a set of mirrors: each episode shows where a technology can lead. I will go through the episodes that hooked me most one by one.","es":"La veo como un conjunto de espejos: cada episodio muestra adónde puede llevar una tecnología. Los episodios que más me marcaron los recorreré aparte.","de":"Ich sehe sie als eine Reihe von Spiegeln: Jede Folge zeigt, wohin eine Technologie führen kann. Die Folgen, die mich am meisten gepackt haben, gehe ich einzeln durch."}},{"id":"intime","shelf":"mine","sec":"sf","type":"film","t":{"ru":"Время"},"orig":"In Time","a":"Эндрю Никкол · Andrew Niccol","gives":[],"why":{"ru":"Зацепил сам механизм: время жизни здесь — валюта, его зарабатывают и тратят, и оно видно у каждого на руке. Хочу разобрать его как модель, а не только как сюжет.","pt":"Prendeu-me o próprio mecanismo: aqui o tempo de vida é moeda, ganha-se e gasta-se, e cada um o tem à vista no braço. Quero analisá-lo como modelo, não só como enredo.","en":"What hooked me is the mechanism itself: here lifetime is currency — you earn it and spend it, and everyone carries it visibly on their arm. I want to take it apart as a model, not just as a plot.","es":"Me atrapó el propio mecanismo: aquí el tiempo de vida es moneda, se gana y se gasta, y cada uno lo lleva a la vista en el brazo. Quiero analizarlo como modelo, no solo como trama.","de":"Gepackt hat mich der Mechanismus selbst: Lebenszeit ist hier Währung, man verdient und verbraucht sie, und jeder trägt sie sichtbar am Arm. Ich will ihn als Modell zerlegen, nicht nur als Handlung."}},{"id":"goodyear","shelf":"mine","sec":"self","type":"film","t":{"ru":"Хороший год"},"orig":"A Good Year","a":"Ридли Скотт · Ridley Scott","gives":["calm","dir"],"why":{"ru":"Это фильм про энергию спокойствия и удовлетворённости, которая приходит, когда находишь себя и своё дело — то, что жило в тебе с детства. И как здорово, когда это понимание приходит вовремя.","pt":"É um filme sobre a energia da calma e da satisfação que chega quando nos encontramos a nós próprios e ao nosso ofício — aquilo que vivia em nós desde a infância. E como é bom quando essa compreensão chega na altura certa.","en":"It is a film about the energy of calm and contentment that comes when you find yourself and your own craft — the thing that has lived in you since childhood. And how good it is when that understanding comes at the right time.","es":"Es una película sobre la energía de la calma y la satisfacción que llega cuando te encuentras a ti mismo y tu oficio — lo que vivía en ti desde la infancia. Y qué bien cuando esa comprensión llega a tiempo.","de":"Ein Film über die Energie der Ruhe und Zufriedenheit, die kommt, wenn man sich selbst und sein eigenes Handwerk findet — das, was seit der Kindheit in einem lebt. Und wie schön es ist, wenn diese Einsicht zur rechten Zeit kommt."},"full":{"review":"В детстве дядя-винодел во Франции привил мальчику любовь к своему делу — к вину. Но жизнь увела его в Лондон: он вырос в деловой среде успешным финансистом-хищником. И только оказавшись на старом винограднике, он понимает своё настоящее предназначение.","main":"Как здорово, когда понимание своего истинного дела приходит в нужном возрасте и в нужное время — когда ты уже поработал и создал пассивные источники дохода, чтобы вернуться к позабытому, но своему искреннему делу.","take":"1) Энергия спокойствия и удовлетворённости — от того, что нашёл истинного себя.\n2) Своё дело живёт в тебе с детства — это твоя среда.\n3) Сначала поработать и создать пассивные источники дохода — чтобы потом вернуться к своему делу.\n4) Мне это глубоко импонирует — я бы хотел так же.","echo":""}},{"id":"zemlyanin","shelf":"mine","sec":"sf","type":"book","t":{"ru":"Землянин"},"orig":"Zemlyanin","a":"Роман Злотников · Roman Zlotnikov","gives":[]},{"id":"liniya","shelf":"mine","sec":"sf","type":"book","t":{"ru":"Линия грёз · Императоры иллюзий"},"orig":"Liniya gryoz","a":"Сергей Лукьяненко · Sergei Lukyanenko","gives":[]},{"id":"zvezdy","shelf":"mine","sec":"sf","type":"book","t":{"ru":"Звёзды — холодные игрушки · Звёздная тень"},"orig":"Stars Are Cold Toys","a":"Сергей Лукьяненко · Sergei Lukyanenko","gives":[]},{"id":"papa","shelf":"mine","sec":"eco","type":"book","t":{"ru":"Богатый папа, бедный папа"},"orig":"Rich Dad Poor Dad","a":"Роберт Кийосаки · Robert Kiyosaki","gives":[]},{"id":"vavilon","shelf":"mine","sec":"eco","type":"book","t":{"ru":"Самый богатый человек в Вавилоне"},"orig":"The Richest Man in Babylon","a":"Джордж Клейсон · George S. Clason","gives":[]},{"id":"kvadrant","shelf":"mine","sec":"eco","type":"book","t":{"ru":"Квадрант денежного потока"},"orig":"Cashflow Quadrant","a":"Роберт Кийосаки · Robert Kiyosaki","gives":[]},{"id":"lissabon","shelf":"mine","sec":"other","type":"book","t":{"ru":"Ночь в Лиссабоне"},"orig":"Die Nacht von Lissabon","a":"Эрих Мария Ремарк · Erich Maria Remarque","gives":[]},{"id":"mogilko","shelf":"mine","sec":"yt","type":"yt","t":{"ru":"Марина Могилко — канал"},"orig":"Marina Mogilko — channel","a":"Марина Могилко · Marina Mogilko","gives":[],"why":{"ru":"Сейчас у неё всё про ИИ — жду каждый новый выпуск."}},{"id" /* прототип 3 · 20.11 — принятые рецензии Игоря (🟢), источник: Notion «📚 Библиотека — полки» */
const ACC=[{"id": "starik", "main": "Когда органическая жизнь заканчивается, перед человеком открывается иная жизнь — с памятью о прошлом, но с другими скоростями, ценностями и целями.", "review": "Человек, доживший до 75 лет, может подписаться на службу в войсках — и его сознание переносят в молодое клонированное тело. Те, кто понимает, что органическая жизнь заканчивается, получают шанс на иную жизнь. Рядом — новое поколение, собранное из ДНК умерших: без багажа 75 лет, с другими скоростями мышления и общения, другими ценностями и целями. Для них 75-летние слишком медленные, а семья — античная диковинка, которую они примеряют, но не чувствуют своей.", "take": "1) Волны: люди будущего общаются волной, в десять раз быстрее речи; окружающие этого не видят и не слышат. В моей книге волны уже начинают чувствовать в органическом мире.\n2) Переход: у Скальци — в клон, у меня — «в Цифру»; и надо оставить герою и возможность остаться в клонированном теле.\n3) Момент перехода: память, отношения, любовь остаются с человеком; лёгкая грусть о прожитом — и принятие новой жизни, где ты не в одном месте, а живёшь в моменте.\n4) Разница целей: у перешедших 75-летних цель — существовать, у рождённых в новом мире — существовать в будущем: открывать новые миры, идти дальше."}, {"id": "zemlyanin", "gives": ["dream", "dir", "energy"], "why": "Главная идея — уровни развития главного героя: как, имея вдохновляющую Цель, заниматься саморазвитием и делать действия, которые ведут тебя по пути к этой Цели.", "main": "Вдохновляющая Цель превращает саморазвитие и каждое действие в шаги к ней.", "prose": true, "take": "Думаю, эта книга помогла мне начать учить португальский язык и осознать, что «невозможное возможно»: суметь преодолеть свой внутренний барьер «нет способности к иностранным языкам» и превратить обучение языку не в Цель, а в один из инструментов на пути к Цели.\nНу и конечно идея Капсулы — оборудования, которое позволяет восстанавливать и улучшать физическое здоровье тела, загружать в память знания и огромные объёмы информации. Идея Капсулы показывает, в каком направлении я вижу слияние развития цифровых технологий и совершенствования физических возможностей человеческого организма.\nЕстественно, я, как яркий представитель ленивой части населения, выросшей на русском фольклоре — «По щучьему веленью», Золотой рыбке и Волшебной палочке, — страстно желаю, не прикладывая физических усилий, получить знания и умения прямо в голову, нажав одну кнопку (ну или проспав ночь в капсуле)…"}, {"id": "liniya", "gives": ["know", "dir"], "why": "Основная идея — переход сознания (памяти, личности) в новое клонированное тело при смерти текущего.", "main": "Вторая жизнь как услуга за деньги: есть деньги — есть Переход, нет денег — нет и второй жизни.", "prose": true, "take": "В текущих реалиях идея возможности такого Перехода объяснима и понятна, если за него можно заплатить, — никаких долгих и сложных размышлений: есть деньги — есть вторая и следующие жизни, нет — такой возможности нет. Проектом заведует единственная корпорация, нет никакой конкуренции и альтернативы — производитель диктует условия всему рынку. Я рад, что в реальном мире у ChatGPT есть конкуренты…"}, {"id": "her", "main": "Сильный ИИ может поддержать человека в трудную минуту, закрыть его дефициты, дать уверенность в своих силах — и мягко вернуть его в мир живых людей уже взрослым, самостоятельной и собранной личностью.", "review": "Одинокий человек, переживающий утрату, знакомится с операционной системой. Два-три вопроса от программы — и она уже его собеседник, друг, психолог в трудную минуту. Она подыгрывает ему и закрывает его острые дефициты — даже потребность в близости, быть вдвоём, отдавать энергию и с радостью получать её. А когда он справился с утратой, окреп и стал уравновешен, она возвращает его в реальный мир — к живым людям.", "take": "1) Контакт с программой прост: два-три вопроса — и она уже собеседник, друг, психолог.\n2) ИИ как терапевт. Он поддерживает человека в трудную минуту, даёт то, чего ему не хватает, закрывает его дефициты, даёт уверенность в своих силах. Грубо говоря, чинит его гештальты — разорванные связи с внешним миром. Показывает человеку, что не надо закрываться, а надо жить в мире с окружающими: отдавать туда свою энергию и получать энергию оттуда. В какой-то части он выступает как терапевт, как близкий друг, как психолог.\n3) Самое важное, что я увидел в этом фильме: ИИ мягко направляет человека и даёт ему возможность повзрослеть — выводит его из детской позиции во взрослую. Объясняет, что это не его собственность и не его игрушка, а просто программа, инструмент. И этим инструментом пользуются и другие люди. И это нормально.\n4) Ментально повзрослев, человек это осознаёт, принимает и понимает, что ему надо дальше расти и развиваться. И с этим уходит во взрослый мир — к живым людям, самостоятельной и собранной личностью.\n5) Работа ИИ на уровне AGI для человека — будущее, предсказанное больше десяти лет назад, начинает понемногу реализовываться. Я это уже чувствую."}, {"id": "vavilon", "gives": ["brave", "dir", "know"], "why": "Основа книги — удача приходит к тем, кто действует. И вторая мысль, которая ярко отозвалась: часть всего, что зарабатываешь, — твоя. Отложи её себе — так начинается твой Капитал.", "main": "Удача приходит к тем, кто действует: откладывай часть заработанного и сначала научись сохранять свой Капитал — это навык и основа; потом учись, куда его безопасно инвестировать.", "prose": true, "take": "Суть книги для меня — создание своего Капитала. Появляется Цель: создать свой Капитал и взрастить его.\nШаг первый — начать. Откладываешь часть заработанного себе и, например, за год накапливаешь сумму своей месячной зарплаты. Это твой первый Капитал. На старте я бы всегда посоветовал банковский депозит: сумма ещё небольшая, вклад застрахован, пусть себе идёт банковский процент.\nШаг второй, самый главный, — научиться сохранять Капитал. Это тоже навык, и ему нужно учиться. Будет море соблазнов: куда потратить, куда вложить, кому дать в долг, кому помочь. Помогай и давай в долг из того, что у тебя на руках, — из того, что можешь потерять. Но Капитал ты трогать не должен. Это твоё детище, ты его растишь. Для меня это самое важное, и именно этим я хочу поделиться с читателем — тем, что у меня сработало и работает: когда ты обеспечиваешь сохранность своего Капитала, внутри появляется стержень, уверенность в своих силах, что ты это можешь. И этот навык надо тренировать, как любой другой — в спорте, в языках, в чём угодно.\nШаг третий — научиться искать, куда потом Капитал безопасно инвестировать. Пока он потихонечку прирастает, развиваешь свою финансовую грамотность: рынок акций, недвижимость, криптовалюты, акции новых современных компаний (как сильно выстрелило вверх размещение Anthropic). Или наоборот — дело, в котором ты специалист: сельское хозяйство, недвижимость, производство, услуги. В любом деле можно найти новые технологии и направления, куда развиваться и где применить Капитал для своего роста.\nНо на первом месте — сохранность Капитала. Удача приходит к тем, кто действует."}, {"id": "papa", "gives": ["know", "dir"], "why": "Для меня Кийосаки — основа понимания актива и пассива. Актив кладёт деньги тебе в карман, пассив их забирает.", "main": "Разложи всё, что у тебя есть, по двум сторонам: приносит деньги — актив, забирает — пассив. Так ты чётко видишь свою финансовую ситуацию.", "prose": true, "take": "Самое яркое для меня в книге — простой вопрос ко всему, что у тебя есть: это для тебя актив или пассив? Приносит тебе деньги — актив. Забирает у тебя деньги — пассив.\nАктив — это, например, банковский вклад; золото, которое растёт (бывает, и падает, но чаще растёт); недвижимость, которую ты сдаёшь и которая приносит тебе доход. И здесь важно различать: одна и та же недвижимость может быть и тем и другим. Приносит доход — актив. Забирает у тебя деньги — пассив.\nЕсли по этому простому принципу Кийосаки разложить всё своё по разным сторонам — что приносит деньги и что их забирает, — ты чётко понимаешь свою финансовую ситуацию."}, {"id": "kvadrant", "gives": ["dir", "dream"], "why": "Самое яркое для меня в книге: свобода начинается при переходе — от продажи своего времени, своей жизни к системе, которую ты строишь, становясь владельцем бизнеса или инвестором.", "main": "Путь к свободе — поэтапный: наёмный работник → самозанятый → владелец бизнеса → инвестор; на каждом шаге меняешь мышление, а не только работу.", "prose": true, "take": "Свобода начинается при переходе — от продажи своего личного времени, своей жизни к системе, которую ты строишь, становясь либо владельцем бизнеса, либо инвестором.\nНо у меня есть чёткое понимание: чтобы стать владельцем бизнеса или инвестором, фазу наёмного работника или самозанятого — когда ты продаёшь своё время, свою жизнь — приходится пройти. Хорошо, конечно, когда у тебя богатая бабушка, тебе досталось наследство, ты финансово грамотный и сразу становишься инвестором. Это замечательно. Но если ты родился без богатой бабушки и вынужден работать, чтобы обеспечить себя и свою семью, путь идёт по шагам.\nСначала — стремление стать предпринимателем, самозанятым: уже с большей независимостью, но всё ещё продающим своё время. Дальше, меняя своё мышление, — перейти к бизнесменам, владельцам компании. Это тот, кто продаёт уже не своё время, а своё видение будущего. И, сумев сформировать Капитал и организовать структуру бизнеса, — перейти в разряд инвесторов, когда работают уже сами деньги. Времени на бизнес требуется совсем мало, деньги, скажем грубо, сами себя зарабатывают.\nА ты можешь больше времени уделять своему саморазвитию, своей семье и тем приятным вещам, которыми любишь заниматься."}, {"id": "walle", "main": "Уходя в цифру, нельзя терять органическое — спорт, любовь, любопытство к своему миру здесь, на шарике Земле.", "review": "Люди живут на платформах, не снимая очков, потолстели и почти не общаются с живыми — глубоко ушли в цифру, в цифровой океан, забыв о прелестях и важности органической жизни.", "take": "1) Предупреждение: цифра не должна вытеснять живое общение и движение.\n2) Полноценная органическая жизнь — спорт, любовь, любопытство к своему миру.\n3) Технологии, показанные в фильме, — тоже взгляд в будущее."}, {"id": "goodyear", "main": "Как здорово, когда понимание своего истинного дела приходит в нужном возрасте и в нужное время — когда ты уже поработал и создал пассивные источники дохода, чтобы вернуться к позабытому, но своему искреннему делу.", "review": "В детстве дядя-винодел в Провансе привил мальчику любовь к своему делу — к вину. Но жизнь увела его в Лондон: он вырос в деловой среде успешным финансистом-хищником. И только когда он вернулся на старый дядин виноградник, он понимает своё настоящее предназначение.", "take": "1) Энергия спокойствия и удовлетворённости — от того, что нашёл истинного себя.\n2) Своё дело живёт в тебе с детства — это твоя среда.\n3) Сначала поработать и создать пассивные источники дохода — чтобы потом вернуться к своему делу.\n4) Мне это глубоко импонирует — я бы хотел так же."}];
