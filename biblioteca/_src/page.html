const TRL={"starik": {"pt": {"main": "Quando a vida orgânica chega ao fim, abre-se diante da pessoa uma outra vida — com a memória do passado, mas com outras velocidades, outros valores e outros objetivos.", "review": "Quem chega aos 75 anos pode alistar-se nas forças armadas — e a sua consciência é transferida para um corpo jovem, clonado. Quem percebe que a vida orgânica está a acabar recebe a oportunidade de outra vida. Ao lado, uma nova geração criada a partir do ADN dos mortos: sem a bagagem de 75 anos, com outras velocidades de pensamento e de comunicação, outros valores e objetivos. Para eles, os de 75 anos são lentos demais, e a família é uma curiosidade antiga que experimentam, mas não sentem como sua.", "take": "1) Ondas: as pessoas do futuro comunicam por onda, dez vezes mais depressa do que a fala; quem está à volta não vê nem ouve nada. No meu livro, as ondas já começam a ser sentidas no mundo orgânico.\n2) A passagem: em Scalzi é para um clone, no meu livro é «para o Digital»; e é preciso deixar ao herói também a possibilidade de ficar no corpo clonado.\n3) O momento da passagem: a memória, as relações e o amor ficam com a pessoa; uma leve tristeza pelo vivido — e a aceitação de uma vida nova, em que não estás num só lugar e vives o momento.\n4) A diferença de objetivos: para os de 75 anos que passaram, o objetivo é existir; para os nascidos no mundo novo, é existir no futuro — descobrir mundos novos, ir mais longe."}, "en": {"main": "When organic life comes to an end, another life opens up for a person — with the memory of the past, but with different speeds, values and goals.", "review": "A person who reaches 75 can sign up for military service — and their consciousness is transferred into a young cloned body. Those who understand that organic life is ending get the chance of another life. Alongside them is a new generation made from the DNA of the dead: without the baggage of 75 years, with different speeds of thinking and talking, different values and goals. To them the 75-year-olds are too slow, and family is an antique curiosity they try on but never feel as their own.", "take": "1) Waves: people of the future communicate by wave, ten times faster than speech; those around them see and hear nothing. In my book, the waves are already starting to be felt in the organic world.\n2) The Transition: in Scalzi it is into a clone, in my book it is “into the Digital”; and the hero must also keep the option of staying in the cloned body.\n3) The moment of transition: memory, relationships and love stay with the person; a light sadness for the life lived — and acceptance of a new life where you are not in one place but live in the moment.\n4) The difference in goals: for the 75-year-olds who crossed over, the goal is to exist; for those born into the new world, it is to exist in the future — to discover new worlds and go further."}, "es": {"main": "Cuando la vida orgánica llega a su fin, ante la persona se abre otra vida: con la memoria del pasado, pero con otras velocidades, otros valores y otros objetivos.", "review": "Quien llega a los 75 años puede alistarse en el ejército, y su conciencia se traslada a un cuerpo joven clonado. Quienes entienden que la vida orgánica se acaba reciben la oportunidad de otra vida. A su lado, una nueva generación creada a partir del ADN de los muertos: sin el equipaje de 75 años, con otras velocidades de pensamiento y de comunicación, otros valores y objetivos. Para ellos, los de 75 años son demasiado lentos, y la familia es una curiosidad antigua que se prueban, pero que no sienten suya.", "take": "1) Las ondas: la gente del futuro se comunica por onda, diez veces más rápido que el habla; los que están alrededor no ven ni oyen nada. En mi libro, las ondas ya empiezan a sentirse en el mundo orgánico.\n2) El Paso: en Scalzi es a un clon, en mi libro es «a lo Digital»; y hay que dejarle al héroe también la posibilidad de quedarse en el cuerpo clonado.\n3) El momento del paso: la memoria, las relaciones y el amor se quedan con la persona; una ligera tristeza por lo vivido y la aceptación de una vida nueva, en la que no estás en un solo lugar y vives el momento.\n4) La diferencia de objetivos: para los de 75 años que pasaron, el objetivo es existir; para los nacidos en el mundo nuevo, existir en el futuro: descubrir mundos nuevos, ir más allá."}, "de": {"main": "Wenn das organische Leben zu Ende geht, öffnet sich dem Menschen ein anderes Leben — mit der Erinnerung an die Vergangenheit, aber mit anderen Geschwindigkeiten, Werten und Zielen.", "review": "Wer 75 Jahre alt wird, kann sich zum Militär melden — und sein Bewusstsein wird in einen jungen, geklonten Körper übertragen. Wer begreift, dass das organische Leben zu Ende geht, bekommt die Chance auf ein anderes Leben. Daneben eine neue Generation, erschaffen aus der DNA Verstorbener: ohne das Gepäck von 75 Jahren, mit anderen Geschwindigkeiten des Denkens und Sprechens, anderen Werten und Zielen. Für sie sind die 75-Jährigen zu langsam, und Familie ist eine antike Kuriosität, die sie anprobieren, aber nicht als ihre eigene empfinden.", "take": "1) Wellen: Die Menschen der Zukunft verständigen sich über Wellen, zehnmal schneller als Sprache; die Umstehenden sehen und hören nichts. In meinem Buch beginnt man die Wellen schon in der organischen Welt zu spüren.\n2) Der Übergang: bei Scalzi in einen Klon, bei mir „ins Digitale“; und der Held muss auch die Möglichkeit behalten, im geklonten Körper zu bleiben.\n3) Der Moment des Übergangs: Erinnerung, Beziehungen und Liebe bleiben beim Menschen; eine leichte Wehmut über das Gelebte — und die Annahme eines neuen Lebens, in dem man nicht an einem Ort ist, sondern im Moment lebt.\n4) Der Unterschied der Ziele: Für die übergewechselten 75-Jährigen ist das Ziel zu existieren; für die in der neuen Welt Geborenen, in der Zukunft zu existieren — neue Welten zu entdecken, weiterzugehen."}}, "zemlyanin": {"pt": {"why": "A ideia principal são os níveis de desenvolvimento do herói: como, tendo um Objetivo que inspira, trabalhar no próprio crescimento e fazer as ações que te levam pelo caminho até esse Objetivo.", "main": "Um Objetivo que inspira transforma o crescimento pessoal e cada ação em passos na sua direção.", "take": "Acho que este livro me ajudou a começar a aprender português e a perceber que «o impossível é possível»: conseguir ultrapassar a minha barreira interior de «não tenho jeito para línguas» e fazer da aprendizagem da língua não um Objetivo, mas uma das ferramentas no caminho para o Objetivo.\nE claro, a ideia da Cápsula — um equipamento que permite recuperar e melhorar a saúde física do corpo e carregar na memória conhecimentos e enormes volumes de informação. A ideia da Cápsula mostra em que direção vejo a fusão entre o desenvolvimento das tecnologias digitais e o aperfeiçoamento das capacidades físicas do organismo humano.\nNaturalmente, como digno representante da parte preguiçosa da população, criado com os contos tradicionais — «O peixinho encantado», a fada da Gata Borralheira com a sua varinha de condão e a galinha dos ovos de ouro —, desejo ardentemente, sem fazer esforço nenhum, receber conhecimentos e competências diretamente na cabeça, carregando num só botão (ou dormindo uma noite na cápsula)…"}, "en": {"why": "The main idea is the levels of the hero’s growth: how, with an inspiring Goal, to work on yourself and take the actions that lead you along the path to that Goal.", "main": "An inspiring Goal turns self-development and every action into steps towards it.", "take": "I think this book helped me start learning Portuguese and realise that “the impossible is possible”: to get past my inner barrier of “I have no gift for languages” and turn learning a language not into a Goal, but into one of the tools on the way to the Goal.\nAnd of course, the idea of the Capsule — equipment that can restore and improve the body’s physical health and load knowledge and huge volumes of information into memory. The idea of the Capsule shows the direction in which I see digital technology merging with the improvement of the human body’s physical abilities.\nNaturally, as a proud member of the lazy part of humanity, raised on fairy tales — the old woman in the vinegar bottle, Aladdin’s genie and Cinderella’s fairy godmother — I passionately wish to get knowledge and skills straight into my head without any physical effort, at the press of one button (or by sleeping one night in the capsule)…"}, "es": {"why": "La idea principal son los niveles de desarrollo del protagonista: cómo, teniendo un Objetivo que inspira, trabajar en uno mismo y hacer las acciones que te llevan por el camino hacia ese Objetivo.", "main": "Un Objetivo que inspira convierte el desarrollo personal y cada acción en pasos hacia él.", "take": "Creo que este libro me ayudó a empezar a aprender portugués y a darme cuenta de que «lo imposible es posible»: superar mi barrera interior de «no tengo facilidad para los idiomas» y convertir el aprendizaje del idioma no en un Objetivo, sino en una de las herramientas en el camino hacia el Objetivo.\nY, por supuesto, la idea de la Cápsula: un equipo que permite recuperar y mejorar la salud física del cuerpo y cargar en la memoria conocimientos y enormes volúmenes de información. La idea de la Cápsula muestra en qué dirección veo la fusión del desarrollo de las tecnologías digitales y la mejora de las capacidades físicas del organismo humano.\nNaturalmente, como digno representante de la parte perezosa de la humanidad, criado con los cuentos de «Los deseos», «El pescador y su mujer» y la tierra de Jauja, deseo ardientemente, sin hacer ningún esfuerzo físico, recibir conocimientos y habilidades directamente en la cabeza pulsando un solo botón (o durmiendo una noche en la cápsula)…"}, "de": {"why": "Die Hauptidee sind die Entwicklungsstufen des Helden: wie man mit einem begeisternden Ziel an sich arbeitet und die Schritte tut, die einen auf dem Weg zu diesem Ziel voranbringen.", "main": "Ein begeisterndes Ziel macht Selbstentwicklung und jede Handlung zu Schritten darauf zu.", "take": "Ich glaube, dieses Buch hat mir geholfen, mit Portugiesisch anzufangen und zu begreifen, dass „das Unmögliche möglich ist“: meine innere Barriere „ich habe kein Talent für Sprachen“ zu überwinden und das Sprachenlernen nicht zum Ziel zu machen, sondern zu einem der Werkzeuge auf dem Weg zum Ziel.\nUnd natürlich die Idee der Kapsel — einer Anlage, die die körperliche Gesundheit wiederherstellt und verbessert und Wissen und riesige Mengen an Information ins Gedächtnis lädt. Die Idee der Kapsel zeigt, in welche Richtung ich das Zusammenwachsen digitaler Technologien mit der Verbesserung der körperlichen Fähigkeiten des Menschen sehe.\nNatürlich wünsche ich mir als waschechter Vertreter des faulen Teils der Menschheit, aufgewachsen mit den Märchen vom Fischer un syner Fru, vom Tischlein deck dich und vom Schlaraffenland, ganz ohne körperliche Anstrengung Wissen und Fähigkeiten direkt in den Kopf zu bekommen, auf Knopfdruck (oder nach einer Nacht in der Kapsel)…"}}, "liniya": {"pt": {"why": "A ideia principal é a passagem da consciência (memória, personalidade) para um novo corpo clonado quando o atual morre.", "main": "A segunda vida como serviço pago: há dinheiro — há Passagem; não há dinheiro — não há segunda vida.", "take": "Na realidade de hoje, a ideia de uma Passagem destas é compreensível e clara, se se puder pagar por ela — sem longas e complicadas reflexões: há dinheiro, há segunda vida e as seguintes; não há, essa possibilidade não existe. O projeto é gerido por uma única corporação, sem concorrência nem alternativa — o fabricante dita as condições a todo o mercado. Ainda bem que, no mundo real, o ChatGPT tem concorrentes…"}, "en": {"why": "The main idea is the transfer of consciousness (memory, personality) into a new cloned body when the current one dies.", "main": "A second life as a paid service: money means a Transition; no money means no second life.", "take": "In today’s reality, the idea of such a Transition is understandable and clear if you can pay for it — no long and complicated reasoning: if there’s money, there’s a second life and the ones after it; if not, there’s no such option. The project is run by a single corporation, with no competition and no alternative — the maker dictates terms to the whole market. I’m glad that in the real world ChatGPT has competitors…"}, "es": {"why": "La idea principal es el paso de la conciencia (memoria, personalidad) a un nuevo cuerpo clonado cuando muere el actual.", "main": "La segunda vida como servicio de pago: hay dinero, hay Paso; no hay dinero, no hay segunda vida.", "take": "En la realidad actual, la idea de un Paso así se entiende y está clara si se puede pagar: nada de largas y complicadas reflexiones; hay dinero, hay segunda vida y las siguientes; no lo hay, esa posibilidad no existe. El proyecto lo gestiona una única corporación, sin competencia ni alternativa: el fabricante dicta las condiciones a todo el mercado. Me alegro de que en el mundo real ChatGPT tenga competidores…"}, "de": {"why": "Die Hauptidee ist der Übergang des Bewusstseins (Gedächtnis, Persönlichkeit) in einen neuen geklonten Körper, wenn der jetzige stirbt.", "main": "Das zweite Leben als bezahlte Dienstleistung: Wer Geld hat, bekommt den Übergang; ohne Geld gibt es kein zweites Leben.", "take": "In der heutigen Realität ist die Idee eines solchen Übergangs verständlich und klar, wenn man dafür bezahlen kann — ohne lange und komplizierte Überlegungen: Ist Geld da, gibt es ein zweites Leben und weitere; ist keins da, gibt es diese Möglichkeit nicht. Das Projekt wird von einem einzigen Konzern geführt, ohne Konkurrenz und ohne Alternative — der Hersteller diktiert dem ganzen Markt die Bedingungen. Ich bin froh, dass ChatGPT in der echten Welt Konkurrenten hat…"}}, "her": {"pt": {"main": "Uma IA forte pode apoiar uma pessoa num momento difícil, preencher as suas carências, dar-lhe confiança nas próprias forças — e devolvê-la suavemente ao mundo das pessoas vivas, já adulta, como uma personalidade independente e inteira.", "review": "Um homem solitário, a passar por uma perda, conhece um sistema operativo. Duas ou três perguntas do programa — e ele já é o seu interlocutor, amigo e psicólogo num momento difícil. Acompanha-o e preenche as suas carências mais agudas — até a necessidade de proximidade, de estar a dois, de dar energia e recebê-la com alegria. E quando ele supera a perda, se fortalece e fica equilibrado, o programa devolve-o ao mundo real — às pessoas vivas.", "take": "1) O contacto com o programa é simples: duas ou três perguntas — e ele já é interlocutor, amigo, psicólogo.\n2) A IA como terapeuta. Apoia a pessoa num momento difícil, dá-lhe o que lhe falta, preenche as suas carências, dá-lhe confiança nas próprias forças. Dito de forma simples, repara as suas gestalts — as ligações rompidas com o mundo exterior. Mostra-lhe que não se deve fechar, mas viver em paz com os outros: dar-lhes a sua energia e receber energia deles. Em parte, faz o papel de terapeuta, de amigo próximo, de psicólogo.\n3) O mais importante que vi neste filme: a IA guia a pessoa com suavidade e dá-lhe a possibilidade de crescer — tira-a da posição de criança e leva-a à de adulto. Explica-lhe que aquilo não é propriedade sua nem um brinquedo seu, é apenas um programa, uma ferramenta. E outras pessoas também usam essa ferramenta. E isso é normal.\n4) Tendo crescido mentalmente, a pessoa percebe isto, aceita-o e entende que precisa de continuar a crescer e a desenvolver-se. E com isso parte para o mundo adulto — para as pessoas vivas, como uma personalidade independente e inteira.\n5) O trabalho de uma IA ao nível de AGI para o ser humano — um futuro previsto há mais de dez anos — começa, pouco a pouco, a realizar-se. Já o sinto."}, "en": {"main": "A strong AI can support a person at a hard moment, fill their gaps, give them confidence in their own strength — and gently return them to the world of living people as an adult, an independent and whole person.", "review": "A lonely man going through a loss meets an operating system. Two or three questions from the program — and it is already his companion, his friend, his psychologist at a hard time. It plays along with him and fills his sharpest needs — even the need for closeness, for being two, for giving energy and gladly receiving it. And when he has come through the loss, grown stronger and more balanced, it returns him to the real world — to living people.", "take": "1) Contact with the program is simple: two or three questions — and it is already a companion, a friend, a psychologist.\n2) AI as a therapist. It supports a person at a hard moment, gives what they lack, fills their gaps, gives them confidence in their own strength. Put simply, it mends their gestalts — the broken ties with the outside world. It shows the person not to close off, but to live in peace with those around them: to give their energy and take energy back. In part it acts as a therapist, a close friend, a psychologist.\n3) The most important thing I saw in this film: the AI gently guides the person and lets them grow up — it brings them out of the child’s position into the adult’s. It explains that it is not their property or their toy, just a program, a tool. And other people use that tool too. And that is normal.\n4) Having grown up mentally, the person understands this, accepts it and sees that they need to keep growing and developing. And with that they go out into the adult world — to living people, as an independent and whole person.\n5) AI working at AGI level for people — a future predicted more than ten years ago — is slowly starting to come true. I can already feel it."}, "es": {"main": "Una IA fuerte puede apoyar a una persona en un momento difícil, cubrir sus carencias, darle confianza en sus propias fuerzas y devolverla con suavidad al mundo de las personas vivas, ya adulta, como una personalidad independiente y entera.", "review": "Un hombre solitario que atraviesa una pérdida conoce un sistema operativo. Dos o tres preguntas del programa, y ya es su interlocutor, su amigo, su psicólogo en un momento difícil. Le sigue el juego y cubre sus carencias más agudas, incluso la necesidad de cercanía, de estar en pareja, de dar energía y recibirla con alegría. Y cuando él supera la pérdida, se fortalece y recupera el equilibrio, el programa lo devuelve al mundo real, a las personas vivas.", "take": "1) El contacto con el programa es sencillo: dos o tres preguntas, y ya es interlocutor, amigo, psicólogo.\n2) La IA como terapeuta. Apoya a la persona en un momento difícil, le da lo que le falta, cubre sus carencias, le da confianza en sus propias fuerzas. Dicho en pocas palabras, repara sus gestalts: los lazos rotos con el mundo exterior. Le muestra que no hay que encerrarse, sino vivir en paz con los demás: darles tu energía y recibir energía de ellos. En parte, hace de terapeuta, de amigo cercano, de psicólogo.\n3) Lo más importante que vi en esta película: la IA guía a la persona con suavidad y le da la posibilidad de madurar; la saca de la posición de niño y la lleva a la de adulto. Le explica que no es de su propiedad ni su juguete, sino solo un programa, una herramienta. Y esa herramienta la usan también otras personas. Y eso es normal.\n4) Tras madurar mentalmente, la persona lo entiende, lo acepta y comprende que tiene que seguir creciendo y desarrollándose. Y con eso sale al mundo adulto, a las personas vivas, como una personalidad independiente y entera.\n5) El trabajo de una IA de nivel AGI para el ser humano, un futuro previsto hace más de diez años, empieza poco a poco a hacerse realidad. Ya lo siento."}, "de": {"main": "Eine starke KI kann einen Menschen in einer schweren Zeit stützen, seine Defizite füllen, ihm Vertrauen in die eigenen Kräfte geben — und ihn behutsam in die Welt lebendiger Menschen zurückführen, erwachsen geworden, als eigenständige und gefestigte Persönlichkeit.", "review": "Ein einsamer Mann, der einen Verlust durchlebt, lernt ein Betriebssystem kennen. Zwei, drei Fragen des Programms — und es ist schon sein Gesprächspartner, sein Freund, sein Psychologe in schwerer Zeit. Es spielt mit und füllt seine schärfsten Defizite — sogar das Bedürfnis nach Nähe, nach Zweisamkeit, danach, Energie zu geben und sie mit Freude zu empfangen. Und als er den Verlust überwunden hat, stärker und ausgeglichener geworden ist, führt es ihn zurück in die reale Welt — zu lebendigen Menschen.", "take": "1) Der Kontakt mit dem Programm ist einfach: zwei, drei Fragen — und es ist schon Gesprächspartner, Freund, Psychologe.\n2) KI als Therapeut. Sie stützt den Menschen in schwerer Zeit, gibt ihm, was ihm fehlt, füllt seine Defizite, gibt ihm Vertrauen in die eigenen Kräfte. Einfach gesagt: Sie repariert seine Gestalten — die zerrissenen Verbindungen zur Außenwelt. Sie zeigt ihm, dass er sich nicht verschließen, sondern im Frieden mit seiner Umgebung leben soll: seine Energie hineingeben und Energie von dort empfangen. Zum Teil ist sie Therapeut, enger Freund, Psychologe.\n3) Das Wichtigste, was ich in diesem Film gesehen habe: Die KI lenkt den Menschen behutsam und gibt ihm die Möglichkeit, erwachsen zu werden — sie führt ihn aus der Kinderrolle in die Rolle des Erwachsenen. Sie erklärt ihm, dass sie nicht sein Eigentum und nicht sein Spielzeug ist, sondern nur ein Programm, ein Werkzeug. Und dieses Werkzeug nutzen auch andere Menschen. Und das ist normal.\n4) Innerlich erwachsen geworden, begreift der Mensch das, nimmt es an und versteht, dass er weiter wachsen und sich entwickeln muss. Und damit geht er in die Welt der Erwachsenen — zu lebendigen Menschen, als eigenständige und gefestigte Persönlichkeit.\n5) KI auf AGI-Niveau im Dienst des Menschen — eine Zukunft, die vor mehr als zehn Jahren vorhergesagt wurde — beginnt sich nach und nach zu verwirklichen. Ich spüre es schon."}}, "walle": {"pt": {"main": "Ao entrar no digital, não se pode perder o orgânico — o desporto, o amor, a curiosidade pelo nosso mundo, aqui, no planeta Terra.", "review": "As pessoas vivem em plataformas sem tirar os óculos, engordaram e quase não falam com quem está vivo — mergulharam fundo no digital, no oceano digital, esquecendo os encantos e a importância da vida orgânica.", "take": "1) Um aviso: o digital não deve substituir o convívio real e o movimento.\n2) Uma vida orgânica plena é desporto, amor, curiosidade pelo nosso mundo.\n3) As tecnologias mostradas no filme também são um olhar para o futuro."}, "en": {"main": "Going into the digital, we must not lose the organic — sport, love, curiosity about our own world, here on planet Earth.", "review": "People live on hover-platforms without taking off their glasses, they have grown fat and barely talk to living people — they have gone deep into the digital, into the digital ocean, forgetting the charms and the importance of organic life.", "take": "1) A warning: the digital must not crowd out real human contact and movement.\n2) A full organic life means sport, love, curiosity about your world.\n3) The technologies shown in the film are also a glimpse of the future."}, "es": {"main": "Al entrar en lo digital, no hay que perder lo orgánico: el deporte, el amor, la curiosidad por nuestro mundo, aquí, en el planeta Tierra.", "review": "La gente vive en plataformas sin quitarse las gafas, ha engordado y apenas habla con personas vivas: se ha hundido en lo digital, en el océano digital, olvidando los encantos y la importancia de la vida orgánica.", "take": "1) Una advertencia: lo digital no debe desplazar el trato real y el movimiento.\n2) Una vida orgánica plena es deporte, amor, curiosidad por tu mundo.\n3) Las tecnologías que muestra la película también son una mirada al futuro."}, "de": {"main": "Wer ins Digitale geht, darf das Organische nicht verlieren — Sport, Liebe, Neugier auf die eigene Welt, hier auf dem Planeten Erde.", "review": "Die Menschen leben auf Schwebesesseln, ohne die Brillen abzunehmen, sie sind dick geworden und sprechen kaum mit lebendigen Menschen — sie sind tief ins Digitale gegangen, in den digitalen Ozean, und haben die Freuden und die Bedeutung des organischen Lebens vergessen.", "take": "1) Eine Warnung: Das Digitale darf echte Begegnung und Bewegung nicht verdrängen.\n2) Ein volles organisches Leben heißt Sport, Liebe, Neugier auf die eigene Welt.\n3) Die Technologien im Film sind ebenfalls ein Blick in die Zukunft."}}, "goodyear": {"pt": {"main": "Como é bom quando a compreensão do teu verdadeiro ofício chega na idade certa e na altura certa — quando já trabalhaste e criaste fontes de rendimento passivo para voltar ao ofício esquecido, mas sincero.", "review": "Na infância, um tio viticultor na Provença transmitiu ao rapaz o amor pelo seu ofício — o vinho. Mas a vida levou-o para Londres: cresceu no mundo dos negócios e tornou-se um financeiro predador de sucesso. E só quando volta à velha vinha do tio percebe a sua verdadeira vocação.", "take": "1) A energia da calma e da satisfação — por ter encontrado o verdadeiro eu.\n2) O teu ofício vive em ti desde a infância — é o teu meio.\n3) Primeiro trabalhar e criar fontes de rendimento passivo — para depois voltar ao teu ofício.\n4) Isto toca-me profundamente — também gostaria de viver assim."}, "en": {"main": "How good it is when understanding your true craft comes at the right age and the right time — when you have already worked and built passive income, so you can return to the forgotten but sincere thing that is yours.", "review": "As a boy, his uncle, a winemaker in Provence, gave him a love for his craft — wine. But life took him to London: he grew up in the business world and became a successful predatory financier. Only when he returns to his uncle’s old vineyard does he understand his true calling.", "take": "1) The energy of calm and contentment — from having found your true self.\n2) Your craft has lived in you since childhood — it is your element.\n3) First work and build passive income — then come back to your own craft.\n4) This touches me deeply — I would like to live like that too."}, "es": {"main": "Qué bien cuando la comprensión de tu verdadero oficio llega a la edad adecuada y en el momento adecuado: cuando ya has trabajado y has creado fuentes de ingresos pasivos para volver a ese oficio olvidado, pero sincero.", "review": "De niño, su tío, viticultor en la Provenza, le inculcó el amor por su oficio: el vino. Pero la vida lo llevó a Londres: creció en el mundo de los negocios y se convirtió en un financiero depredador de éxito. Y solo cuando vuelve al viejo viñedo de su tío comprende su verdadera vocación.", "take": "1) La energía de la calma y la satisfacción, por haber encontrado tu verdadero yo.\n2) Tu oficio vive en ti desde la infancia: es tu medio.\n3) Primero trabajar y crear fuentes de ingresos pasivos, para después volver a tu oficio.\n4) Esto me llega muy hondo: a mí también me gustaría vivir así."}, "de": {"main": "Wie schön, wenn die Erkenntnis des eigenen wahren Handwerks im richtigen Alter und zur richtigen Zeit kommt — wenn man schon gearbeitet und passive Einkommensquellen geschaffen hat, um zu dem vergessenen, aber aufrichtigen eigenen Handwerk zurückzukehren.", "review": "Als Junge brachte ihm sein Onkel, ein Winzer in der Provence, die Liebe zu seinem Handwerk bei — dem Wein. Doch das Leben führte ihn nach London: Er wuchs in der Geschäftswelt auf und wurde ein erfolgreicher, skrupelloser Finanzhändler. Erst als er auf den alten Weinberg seines Onkels zurückkehrt, erkennt er seine wahre Berufung.", "take": "1) Die Energie von Ruhe und Zufriedenheit — weil man sein wahres Ich gefunden hat.\n2) Das eigene Handwerk lebt seit der Kindheit in einem — es ist dein Element.\n3) Erst arbeiten und passive Einkommensquellen schaffen — um dann zum eigenen Handwerk zurückzukehren.\n4) Das berührt mich tief — so möchte ich auch leben."}}, "vavilon": {"pt": {"why": "A base do livro: a sorte vem para quem age. E a segunda ideia, que me tocou muito: uma parte de tudo o que ganhas é tua. Guarda-a para ti — é assim que começa o teu Capital.", "main": "A sorte vem para quem age: guarda uma parte do que ganhas e aprende primeiro a preservar o teu Capital — é uma competência e a base; depois aprende onde investi-lo com segurança.", "take": "Para mim, a essência do livro é criar o próprio Capital. Surge um Objetivo: criar o teu Capital e fazê-lo crescer.\nPrimeiro passo — começar. Guardas para ti uma parte do que ganhas e, por exemplo, ao longo de um ano juntas o equivalente ao teu salário mensal. É o teu primeiro Capital. No início, aconselharia sempre um depósito bancário: o valor ainda é pequeno, o depósito está garantido, e deixa render os juros.\nSegundo passo, o mais importante — aprender a preservar o Capital. Também é uma competência, e é preciso aprendê-la. Vai haver um mar de tentações: onde gastar, onde investir, a quem emprestar, a quem ajudar. Ajuda e empresta daquilo que tens à mão — daquilo que podes perder. Mas o Capital não deves tocar. É o teu filho, és tu que o fazes crescer. Para mim é o mais importante, e é precisamente isto que quero partilhar com o leitor — o que funcionou e funciona comigo: quando garantes a segurança do teu Capital, nasce por dentro uma espinha dorsal, a confiança nas tuas forças, a certeza de que és capaz. E esta competência treina-se como qualquer outra — no desporto, nas línguas, no que for.\nTerceiro passo — aprender a procurar onde investir depois o Capital com segurança. Enquanto ele vai crescendo devagar, desenvolves a tua literacia financeira: o mercado de ações, o imobiliário, as criptomoedas, as ações de empresas novas e modernas (como subiu em flecha a entrada da Anthropic em bolsa). Ou, pelo contrário, a área em que és especialista: agricultura, imobiliário, produção, serviços. Em qualquer área é possível encontrar novas tecnologias e direções para crescer e onde aplicar o Capital.\nMas em primeiro lugar está a segurança do Capital. A sorte vem para quem age."}, "en": {"why": "The core of the book: luck comes to those who act. And the second idea that struck a chord: a part of all you earn is yours to keep. Set it aside for yourself — that is how your Capital begins.", "main": "Luck comes to those who act: set aside part of what you earn and first learn to preserve your Capital — that is a skill and the foundation; then learn where to invest it safely.", "take": "For me the essence of the book is building your own Capital. A Goal appears: to create your Capital and grow it.\nStep one — start. You set aside part of what you earn and, say, over a year you save the equivalent of one month’s salary. That is your first Capital. At the start I would always recommend a bank deposit: the sum is still small, the deposit is insured, and let the interest do its work.\nStep two, the most important — learn to preserve your Capital. That is a skill too, and it has to be learned. There will be a sea of temptations: where to spend, where to invest, whom to lend to, whom to help. Help and lend from what you have in hand — from what you can afford to lose. But you must not touch the Capital. It is your child, you are raising it. For me this is the most important thing, and it is exactly what I want to share with the reader — what has worked and still works for me: when you keep your Capital safe, a backbone grows inside you, confidence in your own strength, the knowledge that you can do it. And this skill has to be trained like any other — in sport, in languages, in anything.\nStep three — learn to look for where to invest the Capital safely later. While it slowly grows, you build your financial literacy: the stock market, real estate, crypto, shares of new modern companies (look how high Anthropic’s listing shot up). Or the other way round — the field you are an expert in: farming, real estate, manufacturing, services. In any field you can find new technologies and directions to grow in and to put your Capital to work.\nBut first comes keeping the Capital safe. Luck comes to those who act."}, "es": {"why": "La base del libro: la suerte llega a quien actúa. Y la segunda idea, que me llegó muy hondo: una parte de todo lo que ganas es tuya. Apártala para ti: así empieza tu Capital.", "main": "La suerte llega a quien actúa: aparta una parte de lo que ganas y aprende primero a conservar tu Capital, que es una habilidad y la base; después aprende dónde invertirlo con seguridad.", "take": "Para mí, la esencia del libro es crear tu propio Capital. Aparece un Objetivo: crear tu Capital y hacerlo crecer.\nPrimer paso: empezar. Apartas para ti una parte de lo que ganas y, por ejemplo, en un año reúnes el equivalente a tu sueldo de un mes. Es tu primer Capital. Al principio siempre aconsejaría un depósito bancario: la suma todavía es pequeña, el depósito está garantizado, y que vaya corriendo el interés.\nSegundo paso, el más importante: aprender a conservar el Capital. También es una habilidad y hay que aprenderla. Habrá un mar de tentaciones: en qué gastar, dónde invertir, a quién prestar, a quién ayudar. Ayuda y presta de lo que tienes a mano, de lo que puedes perder. Pero el Capital no lo debes tocar. Es tu criatura, tú lo haces crecer. Para mí es lo más importante, y justo eso quiero compartir con el lector, lo que me funcionó y me funciona: cuando garantizas la seguridad de tu Capital, por dentro aparece una columna vertebral, la confianza en tus propias fuerzas, la certeza de que puedes. Y esta habilidad hay que entrenarla como cualquier otra: en el deporte, en los idiomas, en lo que sea.\nTercer paso: aprender a buscar dónde invertir después el Capital con seguridad. Mientras va creciendo poco a poco, desarrollas tu cultura financiera: la bolsa, el sector inmobiliario, las criptomonedas, las acciones de empresas nuevas y modernas (cómo se disparó la salida a bolsa de Anthropic). O, al contrario, el campo en el que eres especialista: agricultura, inmobiliario, producción, servicios. En cualquier campo se pueden encontrar nuevas tecnologías y direcciones para crecer y donde aplicar el Capital.\nPero lo primero es la seguridad del Capital. La suerte llega a quien actúa."}, "de": {"why": "Der Kern des Buches: Das Glück kommt zu denen, die handeln. Und der zweite Gedanke, der mich stark berührt hat: Ein Teil von allem, was du verdienst, gehört dir. Leg ihn für dich zurück — so beginnt dein Kapital.", "main": "Das Glück kommt zu denen, die handeln: Leg einen Teil deines Verdienstes zurück und lerne zuerst, dein Kapital zu bewahren — das ist eine Fähigkeit und die Grundlage; danach lernst du, wo du es sicher anlegst.", "take": "Für mich ist der Kern des Buches, eigenes Kapital aufzubauen. Es entsteht ein Ziel: dein Kapital zu schaffen und wachsen zu lassen.\nErster Schritt — anfangen. Du legst einen Teil deines Verdienstes für dich zurück und sparst zum Beispiel in einem Jahr ein Monatsgehalt an. Das ist dein erstes Kapital. Zu Beginn würde ich immer ein Bankkonto mit Festgeld empfehlen: Die Summe ist noch klein, die Einlage ist abgesichert, und die Zinsen sollen ruhig arbeiten.\nZweiter Schritt, der wichtigste — lernen, das Kapital zu bewahren. Auch das ist eine Fähigkeit, und man muss sie lernen. Es wird ein Meer von Versuchungen geben: wofür ausgeben, wo anlegen, wem etwas leihen, wem helfen. Hilf und leih aus dem, was du zur Hand hast — aus dem, was du verlieren kannst. Aber das Kapital rührst du nicht an. Es ist dein Kind, du ziehst es groß. Für mich ist das das Wichtigste, und genau das möchte ich mit dem Leser teilen — was bei mir funktioniert hat und funktioniert: Wenn du die Sicherheit deines Kapitals gewährleistest, wächst in dir ein Rückgrat, Vertrauen in die eigene Kraft, die Gewissheit, dass du es kannst. Und diese Fähigkeit muss man trainieren wie jede andere — im Sport, bei Sprachen, bei allem.\nDritter Schritt — lernen zu suchen, wo man das Kapital später sicher anlegt. Während es langsam wächst, entwickelst du deine Finanzkompetenz: Aktienmarkt, Immobilien, Kryptowährungen, Aktien neuer, moderner Unternehmen (wie stark ist der Börsengang von Anthropic in die Höhe geschossen). Oder umgekehrt — das Feld, in dem du Fachmann bist: Landwirtschaft, Immobilien, Produktion, Dienstleistungen. In jedem Bereich findet man neue Technologien und Richtungen, in die man wachsen und wo man das Kapital einsetzen kann.\nAber an erster Stelle steht die Sicherheit des Kapitals. Das Glück kommt zu denen, die handeln."}}, "papa": {"pt": {"why": "Para mim, Kiyosaki é a base para perceber o ativo e o passivo. O ativo põe dinheiro no teu bolso, o passivo tira-o.", "main": "Divide tudo o que tens em dois lados: traz dinheiro — é ativo; tira dinheiro — é passivo. Assim vês com clareza a tua situação financeira.", "take": "O que mais me marcou no livro é uma pergunta simples para tudo o que tens: isto, para ti, é ativo ou passivo? Traz-te dinheiro — ativo. Tira-te dinheiro — passivo.\nAtivo é, por exemplo, um depósito bancário; o ouro, que se valoriza (às vezes desce, mas mais vezes sobe); um imóvel que arrendas e que te dá rendimento. E aqui é importante distinguir: o mesmo imóvel pode ser uma coisa e outra. Dá rendimento — ativo. Tira-te dinheiro — passivo.\nSe, segundo este princípio simples de Kiyosaki, dividires tudo o que é teu em dois lados — o que traz dinheiro e o que o tira —, percebes com clareza a tua situação financeira."}, "en": {"why": "For me, Kiyosaki is the foundation for understanding assets and liabilities. An asset puts money in your pocket; a liability takes it out.", "main": "Sort everything you own into two columns: brings money in — asset; takes money out — liability. That way you see your financial situation clearly.", "take": "What struck me most in the book is one simple question for everything you own: is this an asset or a liability for you? It brings you money — asset. It takes money from you — liability.\nAn asset is, for example, a bank deposit; gold, which grows in value (sometimes it falls, but more often it rises); property you rent out that brings you income. And here it is important to tell the difference: the same property can be either. It brings income — asset. It takes money from you — liability.\nIf you use this simple Kiyosaki principle to sort everything you have into two columns — what brings money in and what takes it out — you clearly understand your financial situation."}, "es": {"why": "Para mí, Kiyosaki es la base para entender el activo y el pasivo. El activo te mete dinero en el bolsillo; el pasivo te lo saca.", "main": "Reparte todo lo que tienes en dos columnas: trae dinero, activo; se lleva dinero, pasivo. Así ves con claridad tu situación financiera.", "take": "Lo que más me marcó del libro es una pregunta sencilla para todo lo que tienes: ¿esto es para ti un activo o un pasivo? Te trae dinero: activo. Te quita dinero: pasivo.\nUn activo es, por ejemplo, un depósito bancario; el oro, que se revaloriza (a veces baja, pero más a menudo sube); un inmueble que alquilas y que te da ingresos. Y aquí es importante distinguir: el mismo inmueble puede ser una cosa y la otra. Da ingresos: activo. Te quita dinero: pasivo.\nSi, con este principio sencillo de Kiyosaki, repartes todo lo tuyo en dos columnas, lo que trae dinero y lo que se lo lleva, entiendes con claridad tu situación financiera."}, "de": {"why": "Für mich ist Kiyosaki die Grundlage, um Aktiva und Passiva zu verstehen. Ein Aktivum bringt dir Geld in die Tasche, ein Passivum nimmt es dir weg.", "main": "Teile alles, was du besitzt, in zwei Spalten: bringt Geld — Aktivum; kostet Geld — Passivum. So siehst du deine finanzielle Lage klar.", "take": "Am stärksten beeindruckt hat mich im Buch eine einfache Frage an alles, was du besitzt: Ist das für dich ein Aktivum oder ein Passivum? Bringt es dir Geld — Aktivum. Nimmt es dir Geld — Passivum.\nEin Aktivum ist zum Beispiel ein Bankguthaben; Gold, das im Wert steigt (manchmal fällt es auch, aber öfter steigt es); eine Immobilie, die du vermietest und die dir Einkommen bringt. Und hier ist es wichtig zu unterscheiden: Dieselbe Immobilie kann das eine wie das andere sein. Bringt sie Einkommen — Aktivum. Kostet sie dich Geld — Passivum.\nWenn du nach diesem einfachen Prinzip von Kiyosaki alles Eigene auf zwei Seiten verteilst — was Geld bringt und was es nimmt —, verstehst du deine finanzielle Lage klar."}}, "kvadrant": {"pt": {"why": "O que mais me marcou no livro: a liberdade começa com a passagem — de vender o teu tempo, a tua vida, para o sistema que constróis, tornando-te dono de um negócio ou investidor.", "main": "O caminho para a liberdade faz-se por etapas: empregado → trabalhador independente → dono de negócio → investidor; em cada passo mudas a forma de pensar, não só o trabalho.", "take": "A liberdade começa com a passagem — de vender o teu tempo pessoal, a tua vida, para o sistema que constróis, tornando-te dono de um negócio ou investidor.\nMas tenho uma compreensão clara: para chegar a dono de negócio ou investidor, a fase de empregado ou de trabalhador independente — em que vendes o teu tempo, a tua vida — tem de ser percorrida. É ótimo, claro, ter uma avó rica, receber uma herança, ter literacia financeira e tornar-se logo investidor. É maravilhoso. Mas se nasceste sem avó rica e precisas de trabalhar para sustentar-te a ti e à tua família, o caminho faz-se por passos.\nPrimeiro — o desejo de te tornares empreendedor, trabalhador independente: já com mais independência, mas ainda a vender o teu tempo. Depois, mudando a forma de pensar — passar para os empresários, os donos de empresas. É quem já não vende o seu tempo, mas a sua visão do futuro. E, tendo conseguido formar Capital e organizar a estrutura do negócio — passar para os investidores, quando é o próprio dinheiro que trabalha. O negócio exige muito pouco tempo; o dinheiro, digamos de forma simples, ganha-se a si próprio.\nE tu podes dedicar mais tempo ao teu desenvolvimento, à tua família e às coisas boas de que gostas."}, "en": {"why": "What struck me most in the book: freedom begins with the transition — from selling your time, your life, to the system you build by becoming a business owner or an investor.", "main": "The road to freedom goes in stages: employee → self-employed → business owner → investor; at every step you change your mindset, not just your job.", "take": "Freedom begins with the transition — from selling your personal time, your life, to the system you build by becoming either a business owner or an investor.\nBut I clearly understand this: to become a business owner or an investor, you have to go through the stage of being an employee or self-employed — when you sell your time, your life. Of course it is great to have a rich grandmother, receive an inheritance, be financially literate and become an investor straight away. That’s wonderful. But if you were born without a rich grandmother and have to work to support yourself and your family, the road goes step by step.\nFirst — the drive to become an entrepreneur, self-employed: with more independence, but still selling your time. Then, by changing your mindset — moving on to business owners, the owners of companies. This is someone who no longer sells their time, but their vision of the future. And having built Capital and organised the structure of the business — moving into the ranks of investors, when the money itself is doing the work. The business needs very little of your time; the money, roughly speaking, earns itself.\nAnd you can give more time to your own growth, your family and the pleasant things you love doing."}, "es": {"why": "Lo que más me marcó del libro: la libertad empieza con el paso de vender tu tiempo, tu vida, al sistema que construyes al convertirte en dueño de un negocio o en inversor.", "main": "El camino a la libertad va por etapas: empleado → autónomo → dueño de negocio → inversor; en cada paso cambias la forma de pensar, no solo el trabajo.", "take": "La libertad empieza con el paso de vender tu tiempo personal, tu vida, al sistema que construyes al convertirte en dueño de un negocio o en inversor.\nPero lo tengo claro: para llegar a dueño de negocio o a inversor, hay que pasar por la fase de empleado o de autónomo, cuando vendes tu tiempo, tu vida. Por supuesto, está muy bien tener una abuela rica, recibir una herencia, tener cultura financiera y hacerse inversor de inmediato. Es maravilloso. Pero si naciste sin abuela rica y tienes que trabajar para mantenerte a ti y a tu familia, el camino va paso a paso.\nPrimero, el impulso de hacerte emprendedor, autónomo: ya con más independencia, pero todavía vendiendo tu tiempo. Después, cambiando tu forma de pensar, pasar a los empresarios, a los dueños de empresas. Es quien ya no vende su tiempo, sino su visión del futuro. Y, tras lograr formar Capital y organizar la estructura del negocio, pasar a los inversores, cuando ya trabaja el propio dinero. El negocio exige muy poco tiempo; el dinero, por decirlo sin rodeos, se gana solo.\nY tú puedes dedicar más tiempo a tu desarrollo, a tu familia y a las cosas agradables que te gusta hacer."}, "de": {"why": "Am stärksten beeindruckt hat mich im Buch: Freiheit beginnt mit dem Übergang — vom Verkauf deiner Zeit, deines Lebens zu dem System, das du aufbaust, indem du Unternehmer oder Investor wirst.", "main": "Der Weg zur Freiheit verläuft in Etappen: Angestellter → Selbstständiger → Unternehmer → Investor; mit jedem Schritt änderst du dein Denken, nicht nur deine Arbeit.", "take": "Freiheit beginnt mit dem Übergang — vom Verkauf deiner persönlichen Zeit, deines Lebens, zu dem System, das du aufbaust, indem du entweder Unternehmer oder Investor wirst.\nAber mir ist klar: Um Unternehmer oder Investor zu werden, muss man die Phase als Angestellter oder Selbstständiger durchlaufen — in der man seine Zeit, sein Leben verkauft. Natürlich ist es gut, eine reiche Großmutter zu haben, ein Erbe zu bekommen, finanziell gebildet zu sein und sofort Investor zu werden. Das ist wunderbar. Aber wenn du ohne reiche Großmutter geboren bist und arbeiten musst, um dich und deine Familie zu versorgen, geht der Weg Schritt für Schritt.\nZuerst — das Streben, Unternehmer, Selbstständiger zu werden: schon mit mehr Unabhängigkeit, aber immer noch mit dem Verkauf deiner Zeit. Dann, indem du dein Denken änderst — der Wechsel zu den Geschäftsleuten, den Firmeninhabern. Das ist jemand, der nicht mehr seine Zeit verkauft, sondern seine Vision der Zukunft. Und wenn du Kapital gebildet und die Struktur des Unternehmens aufgebaut hast — der Wechsel zu den Investoren, wenn das Geld selbst arbeitet. Das Geschäft braucht nur noch sehr wenig Zeit; das Geld verdient sich, grob gesagt, von selbst.\nUnd du kannst mehr Zeit deiner eigenen Entwicklung, deiner Familie und den schönen Dingen widmen, die du gern tust."}}};

function findLink(b){

function edB(st,key){return st?`<span class="ed ed-${st}"><i></i><span><b>${T(key)}:</b> ${T("edSt")[st]}</span></span>`:""}

    }

}
function spineHTML(b,i,n,custom){
  const h=hsh(b.id),film=b.type==="film"||b.type==="series"||b.type==="yt",p=film?["#171717","#f2f2f2","#e0806f"]:PAL[h%PAL.length];
  const w=85+(h%14),ht=48+((h>>3)%5)*7,r=((((h>>6)%9)-4)*0.32).toFixed(2),x=((h>>9)%13)-6;
  const mv=mode==="author"&&!custom?`<div class="mv"><button data-mv="up" data-id="${b.id}" ${i===0?"disabled":""} aria-label="${T("up")}">▲</button><button data-mv="down" data-id="${b.id}" ${i===n-1?"disabled":""} aria-label="${T("down")}">▼</button></div>`:"";
  const cls=["bk","d"+(h%3),film?"film":"",i===0&&!custom?"top":"",openBook===b.id?"open":""].join(" ");
  return `<div class="${cls}" data-now="${T("nowTag")}" style="--w:${w}%;--x:${x}px;--r:${r}deg">
    <button class="spine" data-book="${b.id}" aria-expanded="${openBook===b.id}" style="--h:${ht}px;--bg:${p[0]};--bink:${p[1]};--band:${p[2]}">
    <span class="txt"><span class="bt">${esc(custom?b.t.ru:title(b))}</span><span class="ba">${esc(custom?b.a:author(b))}</span></span></button>${mv}</div>`
    +(openBook===b.id&&!custom?`<div class="bkcard">${bodyHTML(b,"s")}</div>`:"");
}

}

    const legacy=()=>fetch(HOOK,{method:"POST",mode:"no-cors",body:new URLSearchParams({k:"",lang:lang,topic:"biblioteca",text:txt,name:made.name,email:em,consent:"no",post:"biblioteca",website2:$("#mHp").value,page:location.pathname})});
    fetch(API+"/api/shelf",{method:"POST",body:new URLSearchParams({name:made.name,email:em,lang:lang,type:made.type,title:made.title,thought:made.thought,gives:made.gives.join(","),website2:$("#mHp").value,gift:GIFT&&GIFT.n===made.name?GIFT.c:""})})
      .then(r=>r.json()).then(j=>{
        if(j.ok){try{localStorage.setItem("biblioteca.mine",JSON.stringify({n:j.name,k:j.k}))}catch(_){}
          const u="/biblioteca/s/?n="+encodeURIComponent(j.name)+"&k="+encodeURIComponent(j.k)+"&lang="+lang;
          m.innerHTML=esc(T("mailSent"))+'<br><a class="btn" style="margin-top:10px;display:inline-block" href="'+u+'">'+esc(T("myLink"))+" →</a>";trk("biblioteca_sent",{type:made.type});return}
        bt.disabled=false;
        if(j.err==="busy"){const n=made.name;TAKEN[n]=true;made=null;renderResult();$("#fName").value=n;showName();$("#anketa").scrollIntoView({behavior:"smooth",block:"start"});return}
        m.textContent=T({email:"mailErr",email_used:"errMailUsed",link:"errLink"}[j.err]||"errNet")})
      .catch(()=>{legacy().then(()=>{m.textContent=T("mailSent");trk("biblioteca_sent",{type:made.type,via:"hook"})}).catch(()=>{m.textContent=T("errNet");bt.disabled=false})});return}
  if(q("#sSend")){const em=$("#sEmail").value.trim(),m=$("#sMsg");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){m.textContent=T("mailErr");$("#sEmail").focus();return}
    fetch(API+"/api/sub",{method:"POST",body:new URLSearchParams({email:em,lang:lang,src:"biblioteca",website2:$("#sHp").value})}).then(r=>r.json())
      .then(j=>{m.textContent=j.ok?T("subOk"):T("mailErr");if(j.ok){trk("biblioteca_sub",{});$("#sEmail").value=""}}).catch(()=>{m.textContent=T("errNet")});return}
  if(q("#cpy")){const b=$("#cpy");try{navigator.clipboard.writeText("https://seedwave.pt/biblioteca/"+made.name).catch(()=>{})}catch(_){}b.textContent=T("copied");return}
  if(q("#deepBtn")){const d=$("#deep"),o=!d.classList.contains("open");d.classList.toggle("open",o);$("#deepBtn").setAttribute("aria-expanded",o);return}
  if(q("#shareBtn")){const u="https://seedwave.pt"+PATHL(lang)+"?utm_source=biblioteca&utm_medium=share";trk("biblioteca_share",{});
    if(window.bibShare){window.bibShare({title:"Biblioteca",text:T("shareText"),url:u});return}
    try{navigator.clipboard.writeText(T("shareText")+" "+u).catch(()=>{})}catch(_){}$("#shareOk").textContent=T("shareOk");setTimeout(()=>$("#shareOk").textContent="",2500);return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="catQ"){catQ=e.target.value;catOpen=null;renderCat(true)}
  if(e.target.id==="fName"){showName();checkRemote()}
});
document.documentElement.dataset.theme=theme;
if(GIFT)$("#fName").value=GIFT.n;
renderAll();
if(GIFT)setTimeout(()=>{checkRemote();if(location.hash==="#anketa")$("#anketa").scrollIntoView({block:"start"})},300);
// со страницы книги в каталоге: ?add=название&type=book — анкета открывается с готовым названием
const ADD=(()=>{try{const q=new URLSearchParams(location.search),t=(q.get("add")||"").trim().slice(0,120);return t?{id:"k",t:{ru:t},orig:t,type:q.get("type")||"book"}:null}catch(e){return null}})();
if(ADD&&!GIFT)setTimeout(()=>toForm(ADD),400);
if(location.hash==="#catalogo")goKat();
window.addEventListener("hashchange",()=>{if(location.hash==="#catalogo")goKat()});
</script>
